name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    # Python stdlib only, so a Linux runner is enough. Checks that need the game/Giga files are skipped here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -I -m unittest discover -s tests -v
      - name: Check mod (bundled modifier snapshot)
        run: python3 -I tools/check_mod.py --snapshot-only
