 LFG_EMPIRE_OBADIN_STORY:0 "They called it enlightenment. The Minamar Specialized Industries came to §YTebbran Shallows§! with gifts - implants that let an Obadin read a market the way it reads a current - and then sent the bill. When the Obadin could not pay, the MSI took the reefs, the people and the factories.\n\nThe Obadin took the factories back. Every implant the MSI ever made is now sold, at a markup, in the Syndicate's bazaars, and every credit goes towards one thing: making the MSI pay."
