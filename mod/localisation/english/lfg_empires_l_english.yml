 LFG_EMPIRE_MYRRAN_STORY:0 "The Myrrans rose from the abyssal trenches of §YVael Myrrhos§!: apex hunters who learned that every creature they devoured carried a secret worth keeping. Over ten thousand years they turned predation into commerce. Genomes are their currency now, and the Gene-Tide Exchange buys, sells and splices the traits of every beast in the ocean.\n\nThe stars are a new sea - and it is full of bloodlines no Myrran has ever tasted."
