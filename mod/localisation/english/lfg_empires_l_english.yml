 LFG_EMPIRE_PRIMAN_STORY:0 "Long ago the makers of the great ring around §YPrima§! built the Primes to keep its markets running. Then the ring broke, the makers died, and the markets kept running anyway - because nobody had told the Primes to stop.\n\nOn the last habitable segment, §YShardhaven§!, the Exchange still opens every morning. Its Primes trade in dark matter they learned to bottle long before they learned to fly, preach the gospel of prosperity to anyone who will listen, and are certain the galaxy is simply a larger market waiting to be opened."
