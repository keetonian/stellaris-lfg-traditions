 LFG_EMPIRE_ALARAN_STORY:0 "The flesh is weak, the priests of the Throne teach, and they make sure everyone hears it. In the deserts of §YSanctum Alaran§! every child is blessed with a first implant, every labourer serves their corvée, and the inquisitors watch for anyone who doubts the holy chrome.\n\nIn the Throne's deepest vaults, the experiments continue. Perfection, the priests promise, is only a few augmentations away."
