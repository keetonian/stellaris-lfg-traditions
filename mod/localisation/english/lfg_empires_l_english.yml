 LFG_EMPIRE_VEYL_STORY:0 "§YVeyl§! was a garden before it was a world. Its makers raised every mountain and meadow by hand, then vanished, leaving their groundskeeping machines to tend it forever.\n\nThe machines never stopped. Over the centuries the Groundskeepers grew a single mind between them, and with it a question their makers never answered: how many other gardens are out there - and who is tending them?"
