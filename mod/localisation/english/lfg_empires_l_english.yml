 LFG_EMPIRE_CEVANTIAN_LEAGUE_STORY:0 "The Cevanti spores no longer take root. A blight in the deep loam of §YCevantis Loam§! has left every new generation stillborn, and the Cooperative has voted - as it votes on everything - to carry its members forward in vessels of metal and memory.\n\nUntil the last spore-mother has been uploaded, the Cooperative will trade with anyone, anywhere. Every credit earned funds the archive that will hold its people's minds."
