 LFG_EMPIRE_ALARI_STORY:0 "For as long as the Alari have kept records - and they keep a great many records - a dragon has circled their sun. Every dynasty has sworn itself to the Sky Dragon, and every Dragon-Empress has ruled in its shadow through a bureaucracy so vast that its archives fill whole ocean trenches.\n\nOutsiders are not welcome in the Dominion. The dragon decides who is worthy, and so far it has chosen only the Alari."
