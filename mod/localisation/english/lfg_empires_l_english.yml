 LFG_EMPIRE_CEVELLI_STORY:0 "On §YThunderloam§! the spores ride the lightning. Every storm season the Cevelli bud and scatter on the wind, and the strongest colonies are always those the tempests carried furthest. Their faith is simple: the storm is the great sower, and to chase it is to grow.\n\nThe Cooperative sells everything it finds in the wake of the storms, preaches the gospel of the gale to anyone who will listen - and now the greatest storms of all are waiting out among the stars."
