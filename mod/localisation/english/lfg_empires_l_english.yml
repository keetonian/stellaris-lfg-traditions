 LFG_EMPIRE_CEVANTIAN_FORGE_STORY:0 "Somewhere beneath the molten worlds of §YCevant's Furnace§! lie the bones of the Cevanti, the people who first woke the ancient harvester. Their machines remember them only as a design specification: build, preserve, curate.\n\nThe Directorate has taken all three to heart. Every asteroid will be mined, every relic catalogued, and every mind in the network will work as one."
