 LFG_EMPIRE_THALASSINE_STORY:0 "The Thalassi never left their tanks. When their sea-world died, their ancestors poured its last oceans into the great ring they had raised around their sun, and sealed themselves into drifting brine-tanks borne by the hands of others.\n\nGenerations later they have become the curators of everything the ring remembers: drowned cities, rescued species, and the whispers of something vast beyond the veil that has marked them as its own. The Reliquary trades in wonders - and its oracles are certain the galaxy holds many more."
