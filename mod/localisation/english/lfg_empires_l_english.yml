 LFG_EMPIRE_BEBAKIAN_STORY:0 "The ruins of the old Bebaki empire still cover half of §YOld Bebak§!: a planet-wide city of silent laboratories and libraries nobody alive can read. The Academy was founded to read them.\n\nGenerations of Bebaki scholars have rebuilt the old sciences page by page. Now, with the ancient star charts finally decoded, they mean to find out what happened to everyone else."
