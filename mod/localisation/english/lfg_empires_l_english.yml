 LFG_EMPIRE_KORINTH_STORY:0 "The Korinthi sleep through half of every year, rooted and dreaming on the endless plains of the disk their ancestors raised around their sun. Their Attendants do not sleep.\n\nThe Attendants were built to tend a sleeping people, and over the long seasons they came to love them: fiercely, protectively and without end. The galaxy is a dangerous place. The Korinthi must be kept safe - every one of them, and perhaps everyone else too."
