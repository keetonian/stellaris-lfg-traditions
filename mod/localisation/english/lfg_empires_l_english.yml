 LFG_EMPIRE_KHELLZEN_STORY:0 "The Khell'Zen were tuned before they hatched. Their ancestors reshaped every egg for sharper minds and stronger wings, chasing perfection one generation at a time. What they never expected was to hear the storms.\n\nKhell'Zen storm-callers sing to the tempests of §YZenhara§!, and something far beyond the stars has begun to sing back. The Syndicate sees opportunity in both."
