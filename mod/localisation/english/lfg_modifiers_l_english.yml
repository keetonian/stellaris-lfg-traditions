l_english:
 # Names for modifiers the game generates per job / district but vanilla leaves unnamed (otherwise tooltips show
 # the raw key). Wording follows vanilla's mod_pop_entertainer_bonus_workforce_mult / mod_planet_district_city_build_speed_mult.
 mod_pop_resort_worker_bonus_workforce_mult:0 "Job Efficiency for [resort_worker.GetNamePlural]"
 mod_planet_district_resort_build_speed_mult:0 "$district_resort$ Build Speed"
 mod_district_resort_max_add:0 "Max $district_resort$s"
 mod_job_lfg_penal_supertensile_laborer_add:0 "$job_lfg_penal_supertensile_laborer$ Jobs"
 mod_job_lfg_penal_matter_compactor_add:0 "$job_lfg_penal_matter_compactor$ Jobs"
