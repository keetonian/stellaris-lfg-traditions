l_english:
 # Evolutionary Predators: Species Experimentation edict + event, Inherited Genius trait.
 edict_lfg_species_experimentation:0 "Species Experimentation"
 edict_lfg_species_experimentation_desc:0 "Our predatory evolution can be forced. Subject one of our secondary species to brutal experiments: §Rhalf of them will die§!, and the survivors are split into §Y50§! subspecies, each with a random new positive trait.\n\nRequires a species with at least §Y100§! pops that isn't our main species or one of its subspecies. Costs §Y2000§! £society£ Society Research when a species is chosen."
 lfg_species_experimentation_no_species:0 "$TRIGGER_FAIL$Requires a species with at least §Y100§! pops that isn't our main species or one of its subspecies"
 lfg_species_experimentation_effect_tt:0 "Choose a species to experiment on."
 lfg_species_split.1.name:0 "Species Experimentation"
 lfg_species_split.1.desc:0 "Which species will be subjected to the experiments? §RHalf of them will die§!. The survivors will be split into §Y50§! subspecies, each carrying one new random positive trait, with the population divided evenly between them.\n\nThis costs §R2000§! £society£ Society Research."
 lfg_species_split.1.a:0 "Experiment on the [lfg_split_candidate_1.GetName]."
 lfg_species_split.1.b:0 "Experiment on the [lfg_split_candidate_2.GetName]."
 lfg_species_split.1.c:0 "Experiment on the [lfg_split_candidate_3.GetName]."
 lfg_species_split.1.d:0 "Experiment on the [lfg_split_candidate_4.GetName]."
 lfg_species_split.1.others:0 "Show other species."
 lfg_species_split.1.cancel:0 "Not now."
 lfg_species_split.1.split_tt:0 "§R-2000§! £society£ Society Research\n§RHalf of this species dies.§! The survivors are split into §Y50§! subspecies with a random new positive trait each."
 trait_lfg_inherited_genius:0 "Inherited Genius"
 trait_lfg_inherited_genius_desc:0 "Generations of predatory evolution have rewarded only the sharpest minds. Every member of this species is born with an instinct for discovery, and contributes to our research simply by living among us."
