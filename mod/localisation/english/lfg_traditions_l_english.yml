l_english:
 # ======================= Megaforge =======================
 tradition_lfg_megaforge:0 "Megaforge"
 tradition_lfg_megaforge_desc:0 "Planets are scaffolding; the true work of a civilisation is measured in megastructures. Every surplus is poured into the great works, and the more of them stand, the more they give back."
 tr_lfg_megaforge_adopt:0 "Megaforge Traditions"
 tr_lfg_megaforge_adopt_desc:0 "Requires §YMega-Engineering§! or §YSupertensile Materials§! research.\nUnlocks the §YThe Great Project§! council agenda."
 tr_lfg_megaforge_finish:0 "Megaforge Traditions Finished"
 tr_lfg_megaforge_finish_desc:0 "With §YSupertensiles§!: §G+1§! maximum §YMegaconstruction Logistics Hub§!. Without: §G+1§! megastructure under construction at once.\nAscension Perks Unlocked: §G+1§!"
 tr_lfg_megaforge_guilds:0 "Megaengineer Guilds"
 tr_lfg_megaforge_guilds_desc:0 "Megaengineers are organised into prestigious guilds: they produce more, and the guilds charge for it."
 tr_lfg_megaforge_guilds_delayed:0 "Membership in the guild is hereditary, exclusive, and fiercely defended."
 tr_lfg_megaforge_lattices:0 "Supertensile Lattices"
 tr_lfg_megaforge_lattices_desc:0 "Self-reinforcing lattices cut the upkeep of completed structures, and vast lattice depots let us stockpile on an enormous scale."
 tr_lfg_megaforge_lattices_delayed:0 "A lattice that repairs itself is a lattice that never needs a repair crew."
 tr_lfg_megaforge_priority:0 "Grand Works Priority"
 tr_lfg_megaforge_priority_desc:0 "Megastructure projects jump every queue, and our construction crews work at a frantic pace everywhere, at a premium price."
 tr_lfg_megaforge_priority_delayed:0 "The colony hospital can wait. The ring cannot."
 tr_lfg_megaforge_foundries:0 "Orbital Foundries"
 tr_lfg_megaforge_foundries_desc:0 "Dedicated orbital foundries give every §YSupertensiles Technician§! and §YMegaconstruction Director§! their own refining line, running around the clock. The extra output consumes alloys, and the refineries drain mineral output."
 tr_lfg_megaforge_foundries_delayed:0 "From orbit, the foundries glow brighter than the cities below."
 tr_lfg_megaforge_monuments:0 "Monument Economy"
 tr_lfg_megaforge_monuments_desc:0 "Every megastructure reshapes our economy. We can let the great works draw labour away from our planets, or turn them to the service of our people."
 tr_lfg_megaforge_monuments_delayed:0 "The structure is the economy. Everything else is a rounding error."
 tr_lfg_megaforge_monuments_tt:0 "Unlocks the §YMonument Economy§! policy. For each megastructure we own (including kilostructures, not counting ruins):\n- §YBalanced§! (default): no effect\n- §YMonuments First§!: megastructure output §G+1%§!, job output §R-0.5%§!\n- §YPeople First§!: job output §G+0.5%§!, megastructure output §R-1%§!"






 # ======================= Xenoarchaeology =======================
 tradition_lfg_xenoarchaeology:0 "Xenoarchaeology"
 tradition_lfg_xenoarchaeology_desc:0 "The galaxy is littered with the wreckage of older civilisations. Our scientists chase every anomaly and dig up every ruin, and what they find becomes our future."
 tr_lfg_xenoarchaeology_adopt:0 "Xenoarchaeology Traditions"
 tr_lfg_xenoarchaeology_adopt_desc:0 "Every anomaly is a lead, every ruin a classroom."
 tr_lfg_xenoarchaeology_finish:0 "Xenoarchaeology Traditions Finished"
 tr_lfg_xenoarchaeology_finish_desc:0 "Unlocks the §YGrand Expedition§! council agenda.\nAscension Perks Unlocked: §G+1§!"
 tr_lfg_xenoarchaeology_field_expeditions:0 "Field Expeditions"
 tr_lfg_xenoarchaeology_field_expeditions_desc:0 "Science ships range further and look harder, and find stranger things."
 tr_lfg_xenoarchaeology_field_expeditions_delayed:0 "Pack light. Bring a shovel."
 tr_lfg_xenoarchaeology_anomaly_studies:0 "Anomaly Studies"
 tr_lfg_xenoarchaeology_anomaly_studies_desc:0 "Every anomaly is catalogued and studied long after the science ship has moved on."
 tr_lfg_xenoarchaeology_anomaly_studies_delayed:0 "Footnote 4,812: it was not, in fact, a moon."
 tr_lfg_xenoarchaeology_anomaly_studies_tt:0 "Research speed §G+0.25%§! for each anomaly our science ships have researched since we adopted §YXenoarchaeology§!.\nEach anomaly researched yields §G+5§! £minor_artifacts£ Minor Artifacts."
 tr_lfg_xenoarchaeology_commissioned_digs:0 "Commissioned Digs"
 tr_lfg_xenoarchaeology_commissioned_digs_desc:0 "Why wait for the galaxy to reveal its secrets? Our artifact hoards tell us exactly where to look."
 tr_lfg_xenoarchaeology_commissioned_digs_delayed:0 "Dig here. No, here."
 tr_lfg_xenoarchaeology_commissioned_digs_tt:0 "Unlocks the §YCommission a Dig§! minor artifact action: for §Y2,000§! £minor_artifacts£ Minor Artifacts, choose to create a new §Yarchaeological site§!, §Yanomaly§! or §Yastral rift§! within our borders."
 tr_lfg_xenoarchaeology_expedition_corps:0 "Expedition Corps"
 tr_lfg_xenoarchaeology_expedition_corps_desc:0 "A professional corps of field scientists, seasoned by a hundred strange worlds."
 tr_lfg_xenoarchaeology_expedition_corps_delayed:0 "Veterans of the dig sites never quite unpack."
 tr_lfg_xenoarchaeology_expedition_corps_tt:0 "Scientist capacity §G+1§!\nScientist experience gain §G+15%§!\n§YArchaeo-Engineer§! output §G+25%§!"
 tr_lfg_xenoarchaeology_reverse_engineering:0 "Reverse Engineering"
 tr_lfg_xenoarchaeology_reverse_engineering_desc:0 "Every relic is taken apart, carefully, to learn how its makers thought."
 tr_lfg_xenoarchaeology_reverse_engineering_delayed:0 "It still works. We just don't know why."
 tr_lfg_xenoarchaeology_reverse_engineering_tt:0 "Archaeotech weapon damage §G+10%§!\nResearch speed §G+5%§! for each relic we own."

 # ======================= Abundance =======================
 tradition_lfg_abundance:0 "Abundance"
 tradition_lfg_abundance_desc:0 "Whoever controls the grain controls the state. Our full granaries are a source of stability, growth and political power; an empty granary is a political crisis.\n\nOnly available to empires whose main species eats §Yfood§!."
 tradition_lfg_abundance_hive_desc:0 "The brood gardens are the Hive's true heart. Full stores mean a calm and growing swarm; empty stores mean hunger in the mind."
 tr_lfg_abundance_adopt:0 "Abundance Traditions"
 tr_lfg_abundance_adopt_desc:0 "Unlocks the §YFeast of Plenty§! council agenda."
 tr_lfg_abundance_finish:0 "Abundance Traditions Finished"
 tr_lfg_abundance_finish_desc:0 "Unlocks the §YThe Harvest Tithe§! council agenda.\nAscension Perks Unlocked: §G+1§!"
 tr_lfg_abundance_finish_tt:0 "§YBumper Crops§!: organic pop growth speed §G+1%§! for every §Y1,000§! £food£ Food produced per month.\nAscension Perks Unlocked: §G+1§!"
 tr_lfg_abundance_tithe_barns:0 "Tithe Barns"
 tr_lfg_abundance_tithe_barns_desc:0 "A tithe of every harvest fills the state's barns. Full barns reassure everyone; empty ones frighten them."
 tr_lfg_abundance_tithe_barns_delayed:0 "As long as the barns are full, the people will not riot."
 tr_lfg_abundance_tithe_barns_tt:0 "While we have §Y10,000§!+ £food£ Food stored: stability §G+5§! and organic pop growth speed §G+10%§!.\nWhile we have under §Y1,000§!: stability §R-5§! and organic pop growth speed §R-10%§!."
 tr_lfg_abundance_seed_vaults:0 "Seed Vaults"
 tr_lfg_abundance_seed_vaults_desc:0 "Seed vaults preserve every strain we have ever grown. The fuller our stores, the more united our people feel."
 tr_lfg_abundance_seed_vaults_delayed:0 "Ten thousand varieties of wheat, and a name for every one."
 tr_lfg_abundance_seed_vaults_tt:0 "Unity §G+1%§! for every §Y5,000§! £food£ Food in our stockpile (max §G+20%§!)."
 tr_lfg_abundance_bountiful_fields:0 "Bountiful Fields"
 tr_lfg_abundance_bountiful_fields_desc:0 "Every field is tended like a garden. Farmers produce more."
 tr_lfg_abundance_bountiful_fields_delayed:0 "The harvest festival lasts until the next harvest."
 tr_lfg_abundance_grain_reserves:0 "Grain Reserves"
 tr_lfg_abundance_grain_reserves_desc:0 "Vast state reserves can hold years of grain, and nobody goes hungry: our people eat three times as much."
 tr_lfg_abundance_grain_reserves_delayed:0 "Seven fat years, stored for seven lean ones."
 tr_lfg_abundance_harvest_courts:0 "Harvest Courts"
 tr_lfg_abundance_harvest_courts_desc:0 "Farmers' courts gain a political voice, at the expense of specialists, and a surplus buys influence."
 tr_lfg_abundance_harvest_courts_delayed:0 "The court is in session. The court is also harvesting."
 tr_lfg_abundance_harvest_courts_tt:0 "While our £food£ Food income is positive: influence §G+10%§!."



 # ======================= Broadcast =======================
 tradition_lfg_broadcast:0 "Broadcast"
 tradition_lfg_broadcast_desc:0 "Our entertainment plays on every world in the galaxy. Every empire we meet is a new audience, every trade deal comes with a season pass, and every war is prime time. Our holomuseums become galactic attractions."
 tr_lfg_broadcast_adopt:0 "Broadcast Traditions"
 tr_lfg_broadcast_adopt_tt:0 "Trade §G+1%§! for each empire we have communications with (max §G+20%§!)."
 tr_lfg_broadcast_finish:0 "Broadcast Traditions Finished"
 tr_lfg_broadcast_finish_desc:0 "Unlocks the §YGala Season§! council agenda.\nAscension Perks Unlocked: §G+1§!"
 tr_lfg_broadcast_finish_tt:0 "§YStar Power§!: diplomatic weight §G+1%§! for every §Y1,000§! §YEntertainers§! we employ (max §G+30%§!).\nAscension Perks Unlocked: §G+1§!"
 tr_lfg_broadcast_holo_museums:0 "Holo-Museums"
 tr_lfg_broadcast_holo_museums_desc:0 "Our holomuseums become galactic attractions, drawing record crowds and inspiring everyone who works in them."
 tr_lfg_broadcast_holo_museums_tt:0 "Increases the bonuses from holomuseums."
 tr_lfg_broadcast_holo_museums_delayed:0 "The exhibit is a rock. The queue is four kilometres long."
 tr_lfg_broadcast_celebrity_council:0 "Celebrity Council"
 tr_lfg_broadcast_celebrity_council_desc:0 "Famous faces on the council push agendas through faster, and their shows build unity."
 tr_lfg_broadcast_celebrity_council_delayed:0 "The Minister of Defence is also the host of a cooking show."
 tr_lfg_broadcast_propaganda_serials:0 "Propaganda Serials"
 tr_lfg_broadcast_propaganda_serials_desc:0 "Our serials win hearts abroad, but our own people start taking their politics from television."
 tr_lfg_broadcast_propaganda_serials_delayed:0 "Season 40. The hero is still our ambassador."
 tr_lfg_broadcast_ratings_war:0 "Ratings War"
 tr_lfg_broadcast_ratings_war_desc:0 "Every war is prime time. Our people watch the front like a season finale, and our smear campaigns abroad have never had better ratings."
 tr_lfg_broadcast_ratings_war_delayed:0 "Tonight on the war channel: us versus them. Again. By popular demand."
 tr_lfg_broadcast_ratings_war_tt:0 "While §Yat war§!: war exhaustion gain §G-20%§! and entertainer output §G+20%§!."
 tr_lfg_broadcast_syndication_deals:0 "Syndication Deals"
 tr_lfg_broadcast_syndication_deals_desc:0 "Every trade deal comes bundled with our shows."
 tr_lfg_broadcast_syndication_deals_tt:0 "Entertainer £trade£ Trade §G+0.5§! per §YCommercial Pact§!."
 tr_lfg_broadcast_syndication_deals_delayed:0 "One commercial pact, two seasons of drama."

 # ======================= Tourism =======================
 tradition_lfg_tourism:0 "Tourism"
 tradition_lfg_tourism_desc:0 "Our resort world (or Pleasure World) is the jewel of the galaxy. The more of its people we put to work pampering visitors, the more unity, trade and prestige it brings, and our hospitality schools turn out the finest resort staff among the stars."
 tr_lfg_tourism_adopt:0 "Tourism Traditions"
 tr_lfg_tourism_adopt_desc:0 "Requires §YResort Colonies§! research.\nUnlocks the §YGrand Tour Season§! council agenda."
 tr_lfg_tourism_finish:0 "Tourism Traditions Finished"
 tr_lfg_tourism_finish_desc:0 "Ascension Perks Unlocked: §G+1§!"
 tr_lfg_tourism_hospitality_academies:0 "Hospitality Academies"
 tr_lfg_tourism_hospitality_academies_desc:0 "Academies of hospitality staff every Accommodation District and attraction far beyond its original capacity."
 tr_lfg_tourism_hospitality_academies_delayed:0 "Graduates can fold a towel into eleven species' sacred animals."
 tr_lfg_tourism_hospitality_academies_tt:0 "On our resort world: §YAccommodation Districts§! and their specializations provide §G+50%§! jobs."
 tr_lfg_tourism_package_holidays:0 "Package Holidays"
 tr_lfg_tourism_package_holidays_desc:0 "Affordable holiday packages to our resort world keep the whole empire content."
 tr_lfg_tourism_package_holidays_delayed:0 "Seven worlds in seven days, all-inclusive."
 tr_lfg_tourism_package_holidays_tt:0 "For every §Y100§! §YResort Workers§! employed: unity §G+0.5%§! and pop happiness §G+0.25%§!."
 tr_lfg_tourism_wonders_of_the_galaxy:0 "Paradise Unbound"
 tr_lfg_tourism_wonders_of_the_galaxy_desc:0 "Our resort world keeps growing: every new Accommodation District makes room for more, and grand expansions can push it past its limits."
 tr_lfg_tourism_wonders_of_the_galaxy_tt:0 "Each §YAccommodation District§! adds §G+0.5§! max districts to its planet.\nUnlocks the §YExpand the Resort§! decision on our resort world."
 tr_lfg_tourism_wonders_of_the_galaxy_delayed:0 "Visit the galaxy's largest waterfall. Then visit the second largest, which we also built."
 tr_lfg_tourism_tourist_traps:0 "Tourist Traps"
 tr_lfg_tourism_tourist_traps_desc:0 "Resort workers squeeze every credit out of visitors, but entertainment costs more consumer goods to stage."
 tr_lfg_tourism_tourist_traps_delayed:0 "The souvenir shop is the exit. The exit is the souvenir shop."
 tr_lfg_tourism_galactic_destination:0 "Galactic Destination"
 tr_lfg_tourism_galactic_destination_desc:0 "Visitors from across the galaxy flock to our resort world, and every one of them goes home with a good word for us."
 tr_lfg_tourism_galactic_destination_delayed:0 "Peace talks are so much easier by the pool."
 tr_lfg_tourism_galactic_destination_tt:0 "On our resort world: §YTourists§! produce §G+0.5§! £trade£ Trade.\nDiplomatic weight §G+1%§! for every §Y1,000§! §YTourists§! on our resort world (max §G+30%§!)."
 # ======================= Shellworlders =======================
 tradition_lfg_shellworlders:0 "Shellworlders"
 tradition_lfg_shellworlders_desc:0 "Natural planets are an accident of geology; our people live on worlds that were designed. Most bonuses apply on our §Yartificial worlds§!.\n\nRequires an artificial-world origin, §YOrbital Habitats§! or §YRing World§!."
 tr_lfg_shellworlders_adopt:0 "Shellworlders Traditions"
 tr_lfg_shellworlders_adopt_desc:0 "Our artificial worlds work like the machines they are."
 tr_lfg_shellworlders_adopt_tt:0 "On our §Yartificial worlds§!: job efficiency §G+5%§!."
 tr_lfg_shellworlders_finish:0 "Shellworlders Traditions Finished"
 tr_lfg_shellworlders_finish_desc:0 "Ascension Perks Unlocked: §G+1§!"
 tr_lfg_shellworlders_compact_living:0 "Compact Living"
 tr_lfg_shellworlders_compact_living_desc:0 "Smarter use of every cubic metre lowers housing usage on our artificial worlds."
 tr_lfg_shellworlders_compact_living_delayed:0 "Every wall folds into a bed, and every bed folds into a desk."
 tr_lfg_shellworlders_compact_living_tt:0 "On our §Yartificial worlds§!: housing usage §G-10%§!."
 tr_lfg_shellworlders_artificial_gravity:0 "Artificial Gravity"
 tr_lfg_shellworlders_artificial_gravity_desc:0 "Perfectly tuned gravity and climate make our artificial worlds more stable, and on a world where every corridor was designed, there is nowhere to hide."
 tr_lfg_shellworlders_artificial_gravity_delayed:0 "On a designed world, even the weather follows the schedule."
 tr_lfg_shellworlders_artificial_gravity_tt:0 "On our §Yartificial worlds§!: stability §G+3§! and crime §G-15§!."
 tr_lfg_shellworlders_arc_foundries:0 "Arc Foundries"
 tr_lfg_shellworlders_arc_foundries_desc:0 "Every world we have built teaches us to build the next one faster."
 tr_lfg_shellworlders_arc_foundries_delayed:0 "If you have built one shell, you have built them all."
 tr_lfg_shellworlders_arc_foundries_tt:0 "Megastructure build speed §G+5%§! for every §Yartificial world§! we own."
 tr_lfg_shellworlders_closed_ecology:0 "Closed Ecology"
 tr_lfg_shellworlders_closed_ecology_desc:0 "Managed ecosystems and engineered logistics let every worker on an artificial world do more, and life on an unplanned natural world starts to feel second-rate."
 tr_lfg_shellworlders_closed_ecology_delayed:0 "Every breath is accounted for, and every shift is optimised."
 tr_lfg_shellworlders_closed_ecology_tt:0 "On our §Yartificial worlds§!: job efficiency §G+10%§!.\nOn our natural worlds: happiness §R-10%§! and stability §R-10%§!."
 tr_lfg_shellworlders_arc_neighbours:0 "Arc Neighbours"
 tr_lfg_shellworlders_arc_neighbours_desc:0 "Neighbouring segments, slices and habitats share transit, power and labour: the more designed worlds share a system, the better each one works."
 tr_lfg_shellworlders_arc_neighbours_delayed:0 "Look up, and the city curves over your head."
 tr_lfg_shellworlders_arc_neighbours_tt:0 "Each of our §Yartificial worlds§! gets job efficiency §G+3%§! for every other artificial world we own in the same system."
 lfg_shellworld_adopt:0 "Shellworld"
 lfg_shellworld_adopt_desc:0 "This designed world runs like the machine it is (Shellworlders)."
 lfg_shellworld_compact_living:0 "Compact Living"
 lfg_shellworld_compact_living_desc:0 "Every cubic metre of this artificial world is put to use (Shellworlders)."
 lfg_shellworld_artificial_gravity:0 "Artificial Gravity"
 lfg_shellworld_artificial_gravity_desc:0 "Tuned gravity and climate keep this artificial world calm and orderly (Shellworlders)."
 lfg_shellworld_closed_ecology:0 "Closed Ecology"
 lfg_shellworld_closed_ecology_desc:0 "Engineered logistics make every worker here more effective (Shellworlders)."
 lfg_shellworld_arc_neighbours:0 "Arc Neighbours"
 lfg_shellworld_arc_neighbours_desc:0 "Neighbouring artificial worlds in this system share transit, power and labour (Shellworlders)."
 lfg_shellworld_natural_world:0 "Accident of Geology"
 lfg_shellworld_natural_world_desc:0 "Our people see natural planets as second-rate homes (Closed Ecology)."
 # ======================= Lineage =======================
 tradition_lfg_lineage:0 "Lineage"
 tradition_lfg_lineage_desc:0 "Every flaw is an adaptation. Our weaknesses make us multiply, our gifts make us work harder, and every species and world we embrace makes us stronger.\n\nScales with our §Ymain species' traits§!, our species and the planet types we live on."
 tr_lfg_lineage_adopt:0 "Lineage Traditions"
 tr_lfg_lineage_adopt_desc:0 "Rewriting our genes is no longer taboo: species modification costs less."
 tr_lfg_lineage_finish:0 "Lineage Traditions Finished"
 tr_lfg_lineage_finish_desc:0 "Ascension Perks Unlocked: §G+1§!"
 tr_lfg_lineage_hardship:0 "Strength Through Hardship"
 tr_lfg_lineage_hardship_desc:0 "Every weakness of our species is a reason to multiply."
 tr_lfg_lineage_hardship_delayed:0 "They called us frail. There are simply more of us now."
 tr_lfg_lineage_hardship_tt:0 "For every §Rnegative trait§! of our main species: organic pop growth §G+5%§! and pop assembly speed §G+5%§!."
 tr_lfg_lineage_honed_strengths:0 "Honed Strengths"
 tr_lfg_lineage_honed_strengths_desc:0 "Every gift of our species is trained to perfection."
 tr_lfg_lineage_honed_strengths_delayed:0 "A talent unused is a talent wasted."
 tr_lfg_lineage_honed_strengths_tt:0 "For every §Gpositive trait§! of our main species: job efficiency §G+1%§!."
 tr_lfg_lineage_migratory_instinct:0 "Migratory Instinct"
 tr_lfg_lineage_migratory_instinct_desc:0 "Each species we welcome brings its own instincts for the journey."
 tr_lfg_lineage_migratory_instinct_delayed:0 "Some swim, some fly, some simply refuse to stop moving."
 tr_lfg_lineage_migratory_instinct_tt:0 "For every §Yspecies§! in our empire: ship speed §G+1%§!."
 tr_lfg_lineage_branching_lineages:0 "Branching Lineages"
 tr_lfg_lineage_branching_lineages_desc:0 "Every branch of our family tree is a living experiment worth studying."
 tr_lfg_lineage_branching_lineages_delayed:0 "Cousins, all of them. Fascinating cousins."
 tr_lfg_lineage_branching_lineages_tt:0 "For every §Ysubspecies§! of our main species: society research §G+2%§!."
 tr_lfg_lineage_every_shore:0 "Every Shore"
 tr_lfg_lineage_every_shore_desc:0 "We have made a home on every kind of world, and the galaxy takes note."
 tr_lfg_lineage_every_shore_delayed:0 "Deserts, oceans, rings, shells: home is wherever we adapt to."
 tr_lfg_lineage_every_shore_tt:0 "For every §Yplanet type§! we have a colony on (desert, ocean, habitat, ring world, Gigastructural worlds...): diplomatic weight §G+1%§!."
 # ======================= Penitence =======================
 tradition_lfg_penitence:0 "Penitence"
 tradition_lfg_penitence_desc:0 "Every criminal owes a debt to society, and our §Ypenal colony§! makes sure it is paid in full. The bigger the colony, the more the whole empire profits from its labour camps.\n\nRegular empires only. Requires §YPenal Colonies§! research."
 tr_lfg_penitence_adopt:0 "Penitence Traditions"
 tr_lfg_penitence_adopt_desc:0 "Requires §YPenal Colonies§! research."
 tr_lfg_penitence_adopt_tt:0 "On our §Ypenal colony§!: worker job efficiency §G+10%§! and housing §G+25%§!."
 tr_lfg_penitence_finish:0 "Penitence Traditions Finished"
 tr_lfg_penitence_finish_desc:0 "Ascension Perks Unlocked: §G+1§!"
 tr_lfg_penitence_finish_tt:0 "Unlocks special district specializations for the §YPrison Districts§! of our penal colony, and the §YExpand the Cell Blocks§! decision (§G+1,500§! housing, up to §Y10§! times).\nAscension Perks Unlocked: §G+1§!"
 tr_lfg_penitence_wardens_code:0 "Wardens' Code"
 tr_lfg_penitence_wardens_code_desc:0 "A strict code for the wardens keeps the camps quiet and the guards sharp."
 tr_lfg_penitence_wardens_code_delayed:0 "Lights out at nine. Escape attempts at nine-oh-one, then never again."
 tr_lfg_penitence_wardens_code_tt:0 "On our §Ypenal colony§!: stability §G+5§! and enforcer job efficiency §G+20%§!."
 tr_lfg_penitence_transportation:0 "Transportation"
 tr_lfg_penitence_transportation_desc:0 "Troublemakers and the idle are shipped off to the penal colony, and the rest of the empire is safer for it."
 tr_lfg_penitence_transportation_delayed:0 "One-way tickets, issued generously."
 tr_lfg_penitence_transportation_tt:0 "Every month, §Y10%§! of the §YCivilians§! (jobless pops) on each of our other planets (up to §Y300§! per planet) are shipped to our §Ypenal colony§!, whether or not it has jobs or housing for them."
 tr_lfg_penitence_idle_hands:0 "Idle Hands"
 tr_lfg_penitence_idle_hands_desc:0 "An idle inmate is a wasted inmate. The more of them crowd the camps, the harder every shift is driven."
 tr_lfg_penitence_idle_hands_delayed:0 "No bed until the quota is met. No quota is ever met."
 tr_lfg_penitence_idle_hands_tt:0 "All jobs on our §Ypenal colony§! produce §G+1%§! for every §Y100§! §YCivilians§! there.\n§RNo idle hands:§! with fewer than §Y100§! Civilians there, its jobs produce §R-75%§! instead.\n§RRiots:§! crime §R+2§! there for every §Y100§! Civilians.\n§RAttrition:§! §R3%§! of the Civilians there die every month."
 tr_lfg_penitence_prison_industry:0 "Prison Industry"
 tr_lfg_penitence_prison_industry_desc:0 "Every workshop, lab and office on the penal colony is staffed by inmates working double shifts."
 tr_lfg_penitence_prison_industry_delayed:0 "Made with pride. Made with very little choice."
 tr_lfg_penitence_prison_industry_tt:0 "Jobs from district specializations on our §Ypenal colony§! §G+50%§!."
 tr_lfg_penitence_chain_gangs:0 "Chain Gangs"
 tr_lfg_penitence_chain_gangs_desc:0 "Inmates work in chained crews: cheaper to keep and harder working, and utterly miserable."
 tr_lfg_penitence_chain_gangs_delayed:0 "Nobody sings the work songs any more."
 tr_lfg_penitence_chain_gangs_tt:0 "On our §Ypenal colony§!: worker job efficiency §G+15%§!, pop upkeep §G-15%§!, but happiness §R-15%§!."
 lfg_penal_adopt:0 "Penitence"
 lfg_penal_adopt_desc:0 "The labour camps of this penal colony run on strict quotas (Penitence)."
 lfg_penal_wardens_code:0 "Wardens' Code"
 lfg_penal_wardens_code_desc:0 "Strict wardens keep this penal colony quiet (Penitence)."
 lfg_penal_chain_gangs:0 "Chain Gangs"
 lfg_penal_chain_gangs_desc:0 "Inmates work in chained crews: cheaper and harder working, but miserable (Penitence)."
 zone_lfg_penal_supertensiles:0 "Penal Supertensile Works"
 zone_lfg_penal_supertensiles_desc:0 "Inmates untangle supertensile fibres by hand, one strand at a time, for as long as their sentence lasts."
 job_lfg_penal_supertensile_laborer:0 "Penal Supertensile Laborer"
 job_lfg_penal_supertensile_laborer_plural:0 "Penal Supertensile Laborers"
 job_lfg_penal_supertensile_laborer_desc:0 "Inmates sentenced to the supertensile works, turning minerals into the fibres of megastructures."
 planet_lfg_penal_laborers:0 "Penal Laborers"
 lfg_penal_idle_hands:0 "Idle Hands"
 lfg_penal_idle_hands_desc:0 "Every hundred idle inmates is another shift for the camps, and another riot waiting to happen. Many do not survive the wait (Idle Hands)."
 zone_lfg_penal_bulk_matter:0 "Penal Matter Compactors"
 zone_lfg_penal_bulk_matter_desc:0 "Endless rows of inmates crush rubble into bulk matter. It is the least efficient way in the galaxy to make it, and the empire pays for every gram."
 job_lfg_penal_matter_compactor:0 "Penal Matter Compactor"
 job_lfg_penal_matter_compactor_plural:0 "Penal Matter Compactors"
 job_lfg_penal_matter_compactor_desc:0 "Inmates compacting rubble into bulk matter under enormous presses, consuming staggering amounts of energy and alloys for a few grams a month."
 lfg_penal_no_idle_hands:0 "No Idle Hands"
 lfg_penal_no_idle_hands_desc:0 "With nobody waiting to take their place, the inmates of this penal colony barely work at all (Idle Hands)."
 tr_lfg_lineage_finish_tt:0 "Species trait points §G+1§! and trait picks §G+1§!.\nAscension Perks Unlocked: §G+1§!"
 lfg_lineage_finish:0 "Lineage"
 lfg_lineage_finish_desc:0 "Our species are perfected (Lineage)."
 lfg_lineage_finish_tt:0 "Species trait points §G+1§! and trait picks §G+1§!."
 tr_lfg_tourism_finish_tt:0 "On our §Yresort world§!: job efficiency §G+10%§!.\nAscension Perks Unlocked: §G+1§!"
 lfg_tourism_finish:0 "Tourism"
 lfg_tourism_finish_desc:0 "Every job on this resort world runs like a five-star hotel (Tourism)."

 # ======================= Xenoarchaeology: Commission a Dig =======================
 artifact_lfg_commission_dig:0 "Commission a Dig"
 artifact_lfg_commission_dig_desc:0 "Our minor artifacts are catalogued, cross-referenced and traced back to where they came from. Somewhere within our borders, something is waiting to be found."
 artifact_lfg_commission_dig_effect:0 "Choose what to create within our borders: a new §Yarchaeological site§!, §Yanomaly§! or (with Astral Planes) §Yastral rift§!."
 lfg_commission_dig_no_target:0 "Nothing left to find within our borders: no planet can get a new archaeological site or anomaly, and no system can get an astral rift."
 lfg_commission_dig_no_site:0 "No planet within our borders can get a new archaeological site."
 lfg_commission_dig_no_anomaly:0 "Needs one of our science ships, and an uncolonized planet within our borders without an anomaly."
 lfg_commission_dig_no_rift:0 "No system within our borders can get an astral rift (none may already have one or a scar nearby)."
 lfg_xenoarchaeology.2.name:0 "Commission a Dig"
 lfg_xenoarchaeology.2.desc:0 "Our analysts have traced our minor artifacts back to where they came from. Where should we send the teams?"
 lfg_xenoarchaeology.2.site:0 "Dig Site: unearth the ruins of an older civilisation."
 lfg_xenoarchaeology.2.anomaly:0 "Anomaly: chase down a strange reading."
 lfg_xenoarchaeology.2.rift:0 "Astral Rift: pry open a weak point in reality."
 lfg_xenoarchaeology.2.cancel:0 "Not now. (Refunds the £minor_artifacts£ Minor Artifacts.)"
 lfg_xenoarchaeology.3.name:0 "The Dig Pays Off"
 lfg_xenoarchaeology.3.desc_anomaly:0 "Our analysts have found an §Yanomaly§! on §Y[lfg_dig_location.GetName]§!. A science ship should investigate."
 lfg_xenoarchaeology.3.desc_site:0 "Our teams have found the ruins of an older civilisation on §Y[lfg_dig_location.GetName]§!: a new §Yarchaeological site§! is ready to excavate."
 lfg_xenoarchaeology.3.desc_rift:0 "Our teams have found a weak point in reality in the §Y[lfg_dig_location.GetName]§! system: a new §Yastral rift§! has opened."
 lfg_xenoarchaeology.3.a:0 "Send the teams."
