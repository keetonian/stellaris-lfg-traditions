l_english:
 # ======================= Megaforge Doctrine =======================
 tradition_lfg_megaforge:0 "Megaforge Doctrine"
 tradition_lfg_megaforge_desc:0 "Planets are scaffolding; the true work of a civilisation is measured in megastructures. Every surplus is poured into the great works, and the more of them stand, the more they give back."
 tr_lfg_megaforge_adopt:0 "Megaforge Doctrine Traditions"
 tr_lfg_megaforge_adopt_desc:0 "Requires §YMega-Engineering§! or §YSupertensile Materials§! research.\nUnlocks the §YThe Great Project§! council agenda."
 tr_lfg_megaforge_finish:0 "Megaforge Doctrine Traditions Finished"
 tr_lfg_megaforge_finish_desc:0 "With §YSupertensiles§!: §G+1§! maximum §YMegaconstruction Logistics Hub§!. Without: §G+1§! megastructure under construction at once.\nAscension Perks Unlocked: §G+1§!"
 tr_lfg_megaforge_guilds:0 "Megaengineer Guilds"
 tr_lfg_megaforge_guilds_desc:0 "Megaengineers are organised into prestigious guilds: they produce more, and the guilds charge for it."
 tr_lfg_megaforge_guilds_delayed:0 "Membership in the guild is hereditary, exclusive, and fiercely defended."
 tr_lfg_megaforge_lattices:0 "Supertensile Lattices"
 tr_lfg_megaforge_lattices_desc:0 "Self-reinforcing lattices cut the upkeep of completed structures, and vast lattice depots let us stockpile on an enormous scale."
 tr_lfg_megaforge_lattices_delayed:0 "A lattice that repairs itself is a lattice that never needs a repair crew."
 tr_lfg_megaforge_priority:0 "Grand Works Priority"
 tr_lfg_megaforge_priority_desc:0 "Megastructure projects jump every queue, and our construction crews work at a frantic pace everywhere, at a premium price."
 tr_lfg_megaforge_priority_delayed:0 "The colony hospital can wait. The ring cannot."
 tr_lfg_megaforge_foundries:0 "Orbital Foundries"
 tr_lfg_megaforge_foundries_desc:0 "Dedicated orbital foundries give every §YSupertensiles Technician§! and §YMegaconstruction Director§! their own refining line, running around the clock. The extra output consumes alloys, and the refineries drain mineral output."
 tr_lfg_megaforge_foundries_delayed:0 "From orbit, the foundries glow brighter than the cities below."
 tr_lfg_megaforge_monuments:0 "Monument Economy"
 tr_lfg_megaforge_monuments_desc:0 "Every megastructure reshapes our economy. We can let the great works draw labour away from our planets, or turn them to the service of our people."
 tr_lfg_megaforge_monuments_delayed:0 "The structure is the economy. Everything else is a rounding error."
 tr_lfg_megaforge_monuments_tt:0 "Unlocks the §YMonument Economy§! policy. For each megastructure we own (including kilostructures, not counting ruins):\n- §YBalanced§! (default): no effect\n- §YMonuments First§!: megastructure output §G+1%§!, job output §R-0.5%§!\n- §YPeople First§!: job output §G+0.5%§!, megastructure output §R-1%§!"






 # ======================= Polymath Commons =======================
 tradition_lfg_polymath:0 "Polymath Commons"
 tradition_lfg_polymath_desc:0 "Science is not a profession but a pastime. Ordinary citizens experiment in their kitchens, rival nations spur us on, and every new species brings a new way of thinking. Some experiments end badly."
 tr_lfg_polymath_adopt:0 "Polymath Commons Traditions"
 tr_lfg_polymath_adopt_desc:0 "Science is everyone's business: research speeds up, and professional researchers become more expensive."
 tr_lfg_polymath_finish:0 "Polymath Commons Traditions Finished"
 tr_lfg_polymath_finish_desc:0 "Unlocks the §YEureka Season§! council agenda.\nAscension Perks Unlocked: §G+1§!"
 tr_lfg_polymath_many_minds:0 "Many Minds"
 tr_lfg_polymath_many_minds_desc:0 "Every species thinks differently, and every way of thinking finds something new."
 tr_lfg_polymath_many_minds_delayed:0 "Three species, four opinions, one breakthrough."
 tr_lfg_polymath_many_minds_tt:0 "Research speed §G+1%§! for each species in our empire (max §G+30%§!)."
 tr_lfg_polymath_rival_laboratories:0 "Rival Laboratories"
 tr_lfg_polymath_rival_laboratories_desc:0 "Nothing motivates a scientist like a rival who might publish first."
 tr_lfg_polymath_rival_laboratories_delayed:0 "If they can do it, we can do it faster."
 tr_lfg_polymath_rival_laboratories_tt:0 "Research speed §G+4%§! for each rival (max §G+16%§!).\nWith no rivals: research speed §R-5%§!."
 tr_lfg_polymath_open_journals:0 "Open Journals"
 tr_lfg_polymath_open_journals_desc:0 "Publishing everything freely speeds up research, but our discoveries are no longer leverage abroad."
 tr_lfg_polymath_open_journals_delayed:0 "Knowledge wants to be free. Diplomats want it to be expensive."
 tr_lfg_polymath_reckless_experimentation:0 "Reckless Experimentation"
 tr_lfg_polymath_reckless_experimentation_desc:0 "Safety protocols are a suggestion."
 tr_lfg_polymath_reckless_experimentation_delayed:0 "The crater is now a protected research site."
 tr_lfg_polymath_reckless_experimentation_tt:0 "Yearly, on a random colony (5 years):\n§Y5%§! §RLab Accident§!: stability §R-10§!, researcher output §R-25%§!\n§Y15%§! §GLab Breakthrough§!: stability §G+5§!, researcher output §G+25%§!"
 tr_lfg_polymath_interdisciplinary_seminars:0 "Interdisciplinary Seminars"
 tr_lfg_polymath_interdisciplinary_seminars_desc:0 "Mixing fields opens more research options and draws more scientists."
 tr_lfg_polymath_interdisciplinary_seminars_delayed:0 "Today's seminar: xenobotany for hyperspace engineers."

 # ======================= Granary Kings =======================
 tradition_lfg_granary:0 "Granary Kings"
 tradition_lfg_granary_desc:0 "Whoever controls the grain controls the state. Our full granaries are a source of stability, growth and political power; an empty granary is a political crisis.\n\nOnly available to empires whose main species eats §Yfood§!."
 tradition_lfg_granary_hive_desc:0 "The brood gardens are the Hive's true heart. Full stores mean a calm and growing swarm; empty stores mean hunger in the mind."
 tr_lfg_granary_adopt:0 "Granary Kings Traditions"
 tr_lfg_granary_adopt_desc:0 "Unlocks the §YFeast of Plenty§! council agenda."
 tr_lfg_granary_finish:0 "Granary Kings Traditions Finished"
 tr_lfg_granary_finish_desc:0 "Unlocks the §YThe Harvest Tithe§! council agenda.\nAscension Perks Unlocked: §G+1§!"
 tr_lfg_granary_finish_tt:0 "§YBumper Crops§!: organic pop growth speed §G+1%§! for every §Y1,000§! £food£ Food income per month."
 tr_lfg_granary_tithe_barns:0 "Tithe Barns"
 tr_lfg_granary_tithe_barns_desc:0 "A tithe of every harvest fills the state's barns. Full barns reassure everyone; empty ones frighten them."
 tr_lfg_granary_tithe_barns_delayed:0 "As long as the barns are full, the people will not riot."
 tr_lfg_granary_tithe_barns_tt:0 "While we have §Y10,000§!+ £food£ Food stored: stability §G+5§! and organic pop growth speed §G+10%§!.\nWhile we have under §Y1,000§!: stability §R-5§! and organic pop growth speed §R-10%§!."
 tr_lfg_granary_seed_vaults:0 "Seed Vaults"
 tr_lfg_granary_seed_vaults_desc:0 "Seed vaults preserve every strain we have ever grown. The fuller our stores, the more united our people feel."
 tr_lfg_granary_seed_vaults_delayed:0 "Ten thousand varieties of wheat, and a name for every one."
 tr_lfg_granary_seed_vaults_tt:0 "Unity §G+1%§! for every §Y5,000§! £food£ Food in our stockpile (max §G+20%§!)."
 tr_lfg_granary_bountiful_fields:0 "Bountiful Fields"
 tr_lfg_granary_bountiful_fields_desc:0 "Every field is tended like a garden. Farmers produce more."
 tr_lfg_granary_bountiful_fields_delayed:0 "The harvest festival lasts until the next harvest."
 tr_lfg_granary_grain_reserves:0 "Grain Reserves"
 tr_lfg_granary_grain_reserves_desc:0 "Vast state reserves can hold years of grain, and nobody goes hungry: our people eat twice as much."
 tr_lfg_granary_grain_reserves_delayed:0 "Seven fat years, stored for seven lean ones."
 tr_lfg_granary_harvest_courts:0 "Harvest Courts"
 tr_lfg_granary_harvest_courts_desc:0 "Farmers' courts gain a political voice, at the expense of specialists, and a surplus buys influence."
 tr_lfg_granary_harvest_courts_delayed:0 "The court is in session. The court is also harvesting."
 tr_lfg_granary_harvest_courts_tt:0 "While our £food£ Food income is positive: influence §G+10%§!."



 # ======================= Galactic Broadcast =======================
 tradition_lfg_broadcast:0 "Galactic Broadcast"
 tradition_lfg_broadcast_desc:0 "Our entertainment plays on every world in the galaxy. Every empire we meet is a new audience, every trade deal comes with a season pass, and every war is prime time. Our holomuseums become galactic attractions."
 tr_lfg_broadcast_adopt:0 "Galactic Broadcast Traditions"
 tr_lfg_broadcast_adopt_tt:0 "Trade §G+1%§! for each empire we have communications with (max §G+20%§!)."
 tr_lfg_broadcast_finish:0 "Galactic Broadcast Traditions Finished"
 tr_lfg_broadcast_finish_desc:0 "Unlocks the §YGala Season§! council agenda.\nAscension Perks Unlocked: §G+1§!"
 tr_lfg_broadcast_holo_museums:0 "Holo-Museums"
 tr_lfg_broadcast_holo_museums_desc:0 "Our holomuseums become galactic attractions, drawing record crowds and inspiring everyone who works in them."
 tr_lfg_broadcast_holo_museums_tt:0 "§YHolomuseums§! are §Gtwice as effective§!."
 tr_lfg_broadcast_holo_museums_delayed:0 "The exhibit is a rock. The queue is four kilometres long."
 tr_lfg_broadcast_celebrity_council:0 "Celebrity Council"
 tr_lfg_broadcast_celebrity_council_desc:0 "Famous faces on the council push agendas through faster, and their shows build unity."
 tr_lfg_broadcast_celebrity_council_delayed:0 "The Minister of Defence is also the host of a cooking show."
 tr_lfg_broadcast_propaganda_serials:0 "Propaganda Serials"
 tr_lfg_broadcast_propaganda_serials_desc:0 "Our serials win hearts abroad, but our own people start taking their politics from television."
 tr_lfg_broadcast_propaganda_serials_delayed:0 "Season 40. The hero is still our ambassador."
 tr_lfg_broadcast_ratings_war:0 "Ratings War"
 tr_lfg_broadcast_ratings_war_desc:0 "Every war is prime time. Our people watch the front like a season finale, and our smear campaigns abroad have never had better ratings."
 tr_lfg_broadcast_ratings_war_delayed:0 "Tonight on the war channel: us versus them. Again. By popular demand."
 tr_lfg_broadcast_ratings_war_tt:0 "While §Yat war§!: war exhaustion gain §G-20%§! and entertainer output §G+20%§!."
 tr_lfg_broadcast_syndication_deals:0 "Syndication Deals"
 tr_lfg_broadcast_syndication_deals_desc:0 "Every trade deal comes bundled with our shows."
 tr_lfg_broadcast_syndication_deals_tt:0 "Entertainer £trade£ Trade §G+0.5§! per §YCommercial Pact§!."
 tr_lfg_broadcast_syndication_deals_delayed:0 "One commercial pact, two seasons of drama."

 # ======================= The Grand Tour =======================
 tradition_lfg_resorts:0 "The Grand Tour"
 tradition_lfg_resorts_desc:0 "Our resort world (or Pleasure World) is the jewel of the galaxy. The more of its people we put to work pampering visitors, the more unity, trade and prestige it brings, and our hospitality schools turn out the finest resort staff among the stars."
 tr_lfg_resorts_adopt:0 "The Grand Tour Traditions"
 tr_lfg_resorts_adopt_desc:0 "Requires §YResort Colonies§! research.\nUnlocks the §YGrand Tour Season§! council agenda."
 tr_lfg_resorts_finish:0 "The Grand Tour Traditions Finished"
 tr_lfg_resorts_finish_desc:0 "Ascension Perks Unlocked: §G+1§!"
 tr_lfg_resorts_hospitality_academies:0 "Hospitality Academies"
 tr_lfg_resorts_hospitality_academies_desc:0 "Academies of hospitality staff every Accommodation District and attraction far beyond its original capacity."
 tr_lfg_resorts_hospitality_academies_delayed:0 "Graduates can fold a towel into eleven species' sacred animals."
 tr_lfg_resorts_hospitality_academies_tt:0 "On our Resort or Pleasure World:\nEach §YAccommodation District§! provides §G+150§! more §YResort Worker§! jobs (§G+50%§!).\nEach district specialization (resort, entertainment and attraction specializations) provides §G+50%§! more jobs."
 tr_lfg_resorts_package_holidays:0 "Package Holidays"
 tr_lfg_resorts_package_holidays_desc:0 "Affordable holiday packages to our resort world keep the whole empire content."
 tr_lfg_resorts_package_holidays_delayed:0 "Seven worlds in seven days, all-inclusive."
 tr_lfg_resorts_package_holidays_tt:0 "For every §Y100§! §YResort Workers§! employed: unity §G+0.5%§! and pop happiness §G+0.25%§!."
 tr_lfg_resorts_wonders_of_the_galaxy:0 "Paradise Unbound"
 tr_lfg_resorts_wonders_of_the_galaxy_desc:0 "Our resort world keeps growing: every new Accommodation District makes room for more, and grand expansions can push it past its limits."
 tr_lfg_resorts_wonders_of_the_galaxy_tt:0 "Each §YAccommodation District§! adds §G+0.5§! max districts to its planet.\nUnlocks the §YExpand the Resort§! decision on our resort world."
 tr_lfg_resorts_wonders_of_the_galaxy_delayed:0 "Visit the galaxy's largest waterfall. Then visit the second largest, which we also built."
 tr_lfg_resorts_tourist_traps:0 "Tourist Traps"
 tr_lfg_resorts_tourist_traps_desc:0 "Resort workers squeeze every credit out of visitors, but entertainment costs more consumer goods to stage."
 tr_lfg_resorts_tourist_traps_delayed:0 "The souvenir shop is the exit. The exit is the souvenir shop."
 tr_lfg_resorts_galactic_destination:0 "Galactic Destination"
 tr_lfg_resorts_galactic_destination_desc:0 "Visitors from across the galaxy flock to our resort world, and every one of them goes home with a good word for us."
 tr_lfg_resorts_galactic_destination_delayed:0 "Peace talks are so much easier by the pool."
 tr_lfg_resorts_galactic_destination_tt:0 "On our resort world: §YTourists§! produce §G+1§! £trade£ Trade and §G+1§! £unity£ Unity, and unemployed pops are §G+50%§! more likely to move there.\nDiplomatic weight §G+1%§! for every §Y1,000§! §YTourists§! on our resort world (no cap, updated monthly)."
 # ======================= Shellworlders =======================
 tradition_lfg_shellworlders:0 "Shellworlders"
 tradition_lfg_shellworlders_desc:0 "Natural planets are an accident of geology. Our people live on worlds that were designed: habitats, rings, Alderson slices and stranger shells. Every bonus of this tree applies on our §Yartificial worlds§!, and the more of them we hold, the faster we build.\n\nAvailable to empires with an artificial-world origin, or after researching §YOrbital Habitats§! or §YRing World§!."
 tr_lfg_shellworlders_adopt:0 "Shellworlders Traditions"
 tr_lfg_shellworlders_adopt_desc:0 "Our artificial worlds work like the machines they are."
 tr_lfg_shellworlders_adopt_tt:0 "On our §Yartificial worlds§!: job efficiency §G+5%§!."
 tr_lfg_shellworlders_finish:0 "Shellworlders Traditions Finished"
 tr_lfg_shellworlders_finish_desc:0 "Ascension Perks Unlocked: §G+1§!"
 tr_lfg_shellworlders_compact_living:0 "Compact Living"
 tr_lfg_shellworlders_compact_living_desc:0 "Smarter use of every cubic metre lowers housing usage on our artificial worlds."
 tr_lfg_shellworlders_compact_living_delayed:0 "Every wall folds into a bed, and every bed folds into a desk."
 tr_lfg_shellworlders_compact_living_tt:0 "On our §Yartificial worlds§!: housing usage §G-10%§!."
 tr_lfg_shellworlders_artificial_gravity:0 "Artificial Gravity"
 tr_lfg_shellworlders_artificial_gravity_desc:0 "Perfectly tuned gravity and climate make our artificial worlds more stable, and on a world where every corridor was designed, there is nowhere to hide."
 tr_lfg_shellworlders_artificial_gravity_delayed:0 "On a designed world, even the weather follows the schedule."
 tr_lfg_shellworlders_artificial_gravity_tt:0 "On our §Yartificial worlds§!: stability §G+3§! and crime §G-15§!."
 tr_lfg_shellworlders_arc_foundries:0 "Arc Foundries"
 tr_lfg_shellworlders_arc_foundries_desc:0 "Every world we have built teaches us to build the next one faster."
 tr_lfg_shellworlders_arc_foundries_delayed:0 "If you have built one shell, you have built them all."
 tr_lfg_shellworlders_arc_foundries_tt:0 "Megastructure build speed §G+5%§! for every §Yartificial world§! we own (no cap)."
 tr_lfg_shellworlders_closed_ecology:0 "Closed Ecology"
 tr_lfg_shellworlders_closed_ecology_desc:0 "Managed ecosystems and engineered logistics let every worker on an artificial world do more, and life on an unplanned natural world starts to feel second-rate."
 tr_lfg_shellworlders_closed_ecology_delayed:0 "Every breath is accounted for, and every shift is optimised."
 tr_lfg_shellworlders_closed_ecology_tt:0 "On our §Yartificial worlds§!: job efficiency §G+10%§!.\nOn our natural worlds: happiness §R-10%§! and stability §R-10%§!."
 tr_lfg_shellworlders_arc_neighbours:0 "Arc Neighbours"
 tr_lfg_shellworlders_arc_neighbours_desc:0 "Neighbouring segments, slices and habitats share transit, power and labour: the more designed worlds share a system, the better each one works."
 tr_lfg_shellworlders_arc_neighbours_delayed:0 "Look up, and the city curves over your head."
 tr_lfg_shellworlders_arc_neighbours_tt:0 "Each of our §Yartificial worlds§! gets job efficiency §G+3%§! for every other artificial world we own in the same system (no cap; updated monthly)."
 lfg_shellworld_adopt:0 "Shellworld"
 lfg_shellworld_adopt_desc:0 "This designed world runs like the machine it is (Shellworlders)."
 lfg_shellworld_compact_living:0 "Compact Living"
 lfg_shellworld_compact_living_desc:0 "Every cubic metre of this artificial world is put to use (Shellworlders)."
 lfg_shellworld_artificial_gravity:0 "Artificial Gravity"
 lfg_shellworld_artificial_gravity_desc:0 "Tuned gravity and climate keep this artificial world calm and orderly (Shellworlders)."
 lfg_shellworld_closed_ecology:0 "Closed Ecology"
 lfg_shellworld_closed_ecology_desc:0 "Engineered logistics make every worker here more effective (Shellworlders)."
 lfg_shellworld_arc_neighbours:0 "Arc Neighbours"
 lfg_shellworld_arc_neighbours_desc:0 "Neighbouring artificial worlds in this system share transit, power and labour (Shellworlders)."
 lfg_shellworld_natural_world:0 "Accident of Geology"
 lfg_shellworld_natural_world_desc:0 "Our people see natural planets as second-rate homes (Closed Ecology)."
