l_english:
 # ---------------- Megaforge Doctrine ----------------
 tradition_lfg_megaforge:0 "Megaforge Doctrine"
 tradition_lfg_megaforge_desc:0 "Planets are scaffolding; the true work of a civilisation is measured in megastructures. Every surplus is poured into the great works, and ordinary industry is left to make do.\n\n§YSupertensile§! bonuses apply when Gigastructural's job-based construction is enabled; otherwise they become megastructure cost and upkeep reductions."
 tr_lfg_megaforge_adopt:0 "Megaforge Doctrine Traditions"
 tr_lfg_megaforge_adopt_desc:0 "Requires §YMega-Engineering§! or §YSupertensile Materials§! research."
 tr_lfg_megaforge_finish:0 "Megaforge Doctrine Traditions Finished"
 tr_lfg_megaforge_finish_desc:0 "Ascension Perks Unlocked: §G+1§!"
 tr_lfg_megaforge_guilds:0 "Megaengineer Guilds"
 tr_lfg_megaforge_guilds_desc:0 "Megaengineers are organised into prestigious guilds, at the expense of ordinary workers."
 tr_lfg_megaforge_guilds_delayed:0 "Membership in the guild is hereditary, exclusive, and fiercely defended."
 tr_lfg_megaforge_lattices:0 "Supertensile Lattices"
 tr_lfg_megaforge_lattices_desc:0 "Self-reinforcing lattices reduce the supertensile upkeep of completed structures and expand our stockpiles. Trade suffers as freighters are requisitioned."
 tr_lfg_megaforge_lattices_delayed:0 "A lattice that repairs itself is a lattice that never needs a repair crew."
 tr_lfg_megaforge_priority:0 "Grand Works Priority"
 tr_lfg_megaforge_priority_desc:0 "Megastructure projects jump every queue. Planetary construction becomes slower and more expensive."
 tr_lfg_megaforge_priority_delayed:0 "The colony hospital can wait. The ring cannot."
 tr_lfg_megaforge_foundries:0 "Orbital Foundries"
 tr_lfg_megaforge_foundries_desc:0 "Dedicated orbital foundries refine supertensiles around the clock, draining mineral output."
 tr_lfg_megaforge_foundries_delayed:0 "From orbit, the foundries glow brighter than the cities below."
 tr_lfg_megaforge_monuments:0 "Monument Economy"
 tr_lfg_megaforge_monuments_desc:0 "Our megastructures are run as the heart of the economy, at the cost of planetary power grids."
 tr_lfg_megaforge_monuments_delayed:0 "The structure is the economy. Everything else is a rounding error."

 # ---------------- Leisure Society ----------------
 tradition_lfg_leisure:0 "Leisure Society"
 tradition_lfg_leisure_desc:0 "Work is something to be minimised, not celebrated. Our citizens measure a good life in free time, culture and comfort, and our workers notice that they are not part of the celebration."
 tr_lfg_leisure_adopt:0 "Leisure Society Traditions"
 tr_lfg_leisure_finish:0 "Leisure Society Traditions Finished"
 tr_lfg_leisure_finish_desc:0 "Ascension Perks Unlocked: §G+1§!"
 tr_lfg_leisure_arts:0 "Patronage of the Arts"
 tr_lfg_leisure_arts_desc:0 "Civilians with free time produce culture, and culture produces unity."
 tr_lfg_leisure_arts_delayed:0 "Every street corner has a gallery, and every gallery has an audience."
 tr_lfg_leisure_markets:0 "Leisure Markets"
 tr_lfg_leisure_markets_desc:0 "Entertainment, dining and tourism turn idle civilians into a source of trade."
 tr_lfg_leisure_markets_delayed:0 "Leisure is our largest export, and our largest import."
 tr_lfg_leisure_shorter_shifts:0 "Shorter Shifts"
 tr_lfg_leisure_shorter_shifts_desc:0 "Everyone is happier with a shorter working day, but workers produce less."
 tr_lfg_leisure_shorter_shifts_delayed:0 "The four-hour workday was a triumph of the people. Productivity reports were not consulted."
 tr_lfg_leisure_citizen_dividend:0 "Citizen Dividend"
 tr_lfg_leisure_citizen_dividend_desc:0 "Political power shifts to the leisured civilian class, away from workers."
 tr_lfg_leisure_citizen_dividend_delayed:0 "Those with time to attend the assemblies end up running them."
 tr_lfg_leisure_amenity_culture:0 "Amenity Culture"
 tr_lfg_leisure_amenity_culture_desc:0 "Comfort is everywhere, and workers now expect a share of it in consumer goods."
 tr_lfg_leisure_amenity_culture_delayed:0 "A society of comfort is only as comfortable as its least comfortable member."

 # ---------------- Attendant Robotics ----------------
 tradition_lfg_attendants:0 "Attendant Robotics"
 tradition_lfg_attendants_desc:0 "Robots are not workers to be mass-produced, but trusted attendants to be carefully made, licensed and maintained. Fewer robots, better robots.\n\nEmpires with the §YPampered Masters§! civic gain extra bonuses."
 tr_lfg_attendants_adopt:0 "Attendant Robotics Traditions"
 tr_lfg_attendants_adopt_desc:0 "Requires §YRobotic Workers§! research."
 tr_lfg_attendants_finish:0 "Attendant Robotics Traditions Finished"
 tr_lfg_attendants_finish_desc:0 "Ascension Perks Unlocked: §G+1§!\n§YPampered Masters§!: organic workforce increased."
 tr_lfg_attendants_domestic_protocols:0 "Domestic Protocols"
 tr_lfg_attendants_domestic_protocols_desc:0 "Servant robots are far more effective, and organics need fewer amenities."
 tr_lfg_attendants_domestic_protocols_delayed:0 "The house is clean, the meal is warm, and the robot has already left the room."
 tr_lfg_attendants_quality_over_quantity:0 "Quality over Quantity"
 tr_lfg_attendants_quality_over_quantity_desc:0 "Each robot is built to a higher standard, so fewer are built."
 tr_lfg_attendants_quality_over_quantity_delayed:0 "A thousand cheap robots is a thousand problems. One good robot is a solution."
 tr_lfg_attendants_licensed_roboticists:0 "Licensed Roboticists"
 tr_lfg_attendants_licensed_roboticists_desc:0 "Licensing makes robots cheaper to maintain, but limits how many roboticists may work."
 tr_lfg_attendants_licensed_roboticists_delayed:0 "Applicants must pass eleven examinations, and a cup of tea test."
 tr_lfg_attendants_personal_valets:0 "Personal Valets"
 tr_lfg_attendants_personal_valets_desc:0 "Every citizen is attended to, and they are happier for it. Doubled for §YPampered Masters§!."
 tr_lfg_attendants_personal_valets_delayed:0 "Nobody has tied their own shoelaces in a generation."
 tr_lfg_attendants_household_ai:0 "Household AI"
 tr_lfg_attendants_household_ai_desc:0 "Robots look after each other, using far fewer amenities. §YPampered Masters§! robots also work harder."
 tr_lfg_attendants_household_ai_delayed:0 "The house manages the robots. The robots manage the house. Everyone is happy."

 # ---------------- Overclocked Network ----------------
 tradition_lfg_overclock:0 "Overclocked Network"
 tradition_lfg_overclock_desc:0 "Processing priority is a finite resource. Complex drones receive it; simple drones run at reduced clock speeds."
 tr_lfg_overclock_adopt:0 "Overclocked Network Traditions"
 tr_lfg_overclock_finish:0 "Overclocked Network Traditions Finished"
 tr_lfg_overclock_finish_desc:0 "Ascension Perks Unlocked: §G+1§!"
 tr_lfg_overclock_priority_threads:0 "Priority Threads"
 tr_lfg_overclock_priority_threads_desc:0 "Complex drones get the fast threads; simple drones wait their turn."
 tr_lfg_overclock_priority_threads_delayed:0 "QUEUE POSITION: 4,000,112. ESTIMATED WAIT: IRRELEVANT."
 tr_lfg_overclock_coolant_loops:0 "Coolant Loops"
 tr_lfg_overclock_coolant_loops_desc:0 "Better cooling lowers the upkeep of every job."
 tr_lfg_overclock_coolant_loops_delayed:0 "THERMAL THROTTLING ELIMINATED."
 tr_lfg_overclock_burst_assembly:0 "Burst Assembly"
 tr_lfg_overclock_burst_assembly_desc:0 "Assembly lines run at burst speed, borrowing cycles from simple drones."
 tr_lfg_overclock_burst_assembly_delayed:0 "UNITS PRODUCED: MORE."
 tr_lfg_overclock_heuristic_cores:0 "Heuristic Cores"
 tr_lfg_overclock_heuristic_cores_desc:0 "Spare cycles are spent on research instead of mining."
 tr_lfg_overclock_heuristic_cores_delayed:0 "HYPOTHESIS GENERATED. HYPOTHESIS TESTED. HYPOTHESIS DISCARDED. REPEAT."
 tr_lfg_overclock_redline:0 "Redline"
 tr_lfg_overclock_redline_desc:0 "Complex drones run past their rated limits; simple drones are throttled to compensate."
 tr_lfg_overclock_redline_delayed:0 "WARRANTY: VOID. OUTPUT: OPTIMAL."

 # ---------------- Shellworlders ----------------
 tradition_lfg_shellworlders:0 "Shellworlders"
 tradition_lfg_shellworlders_desc:0 "Natural planets are an accident of geology. Our people live on worlds that were designed: habitats, rings and shells. Life there is stable and orderly, if a little cramped.\n\nAvailable to empires with an artificial-world origin, or after researching §YOrbital Habitats§! or §YRing World§!."
 tr_lfg_shellworlders_adopt:0 "Shellworlders Traditions"
 tr_lfg_shellworlders_finish:0 "Shellworlders Traditions Finished"
 tr_lfg_shellworlders_finish_desc:0 "Ascension Perks Unlocked: §G+1§!"
 tr_lfg_shellworlders_compact_living:0 "Compact Living"
 tr_lfg_shellworlders_compact_living_desc:0 "Smarter use of every cubic metre lowers housing usage."
 tr_lfg_shellworlders_compact_living_delayed:0 "Every wall folds into a bed, and every bed folds into a desk."
 tr_lfg_shellworlders_artificial_gravity:0 "Artificial Gravity"
 tr_lfg_shellworlders_artificial_gravity_desc:0 "Perfectly tuned gravity and climate make planets more stable."
 tr_lfg_shellworlders_artificial_gravity_delayed:0 "On a designed world, even the weather follows the schedule."
 tr_lfg_shellworlders_frame_engineering:0 "Frame Engineering"
 tr_lfg_shellworlders_frame_engineering_desc:0 "Standardised frames make habitats and frameworlds cheaper to build."
 tr_lfg_shellworlders_frame_engineering_delayed:0 "If you have built one shell, you have built them all."
 tr_lfg_shellworlders_closed_ecology:0 "Closed Ecology"
 tr_lfg_shellworlders_closed_ecology_desc:0 "Managed ecosystems improve amenities, but growth is strictly limited."
 tr_lfg_shellworlders_closed_ecology_delayed:0 "Every breath is accounted for, and every birth is planned."
 tr_lfg_shellworlders_ring_cities:0 "Ring Cities"
 tr_lfg_shellworlders_ring_cities_desc:0 "Experience with artificial worlds speeds up megastructure construction and packs cities tighter."
 tr_lfg_shellworlders_ring_cities_delayed:0 "Look up, and the city curves over your head."

 # ---------------- Stellar Harvest ----------------
 tradition_lfg_stellar_harvest:0 "Stellar Harvest"
 tradition_lfg_stellar_harvest_desc:0 "Why scratch at planets when the star gives everything freely? Our economy runs on starlight, and farms and mines are left behind."
 tr_lfg_stellar_harvest_adopt:0 "Stellar Harvest Traditions"
 tr_lfg_stellar_harvest_adopt_desc:0 "Requires §YDyson Swarm§! or §YDyson Sphere§! research."
 tr_lfg_stellar_harvest_finish:0 "Stellar Harvest Traditions Finished"
 tr_lfg_stellar_harvest_finish_desc:0 "Ascension Perks Unlocked: §G+1§!"
 tr_lfg_stellar_harvest_collector_arrays:0 "Collector Arrays"
 tr_lfg_stellar_harvest_collector_arrays_desc:0 "Energy output rises as mining is wound down."
 tr_lfg_stellar_harvest_collector_arrays_delayed:0 "The mines closed. Nobody missed them."
 tr_lfg_stellar_harvest_photonic_agriculture:0 "Photonic Agriculture"
 tr_lfg_stellar_harvest_photonic_agriculture_desc:0 "Megastructures double as growing light for orbital farms, lowering their upkeep."
 tr_lfg_stellar_harvest_photonic_agriculture_delayed:0 "The sun never sets on the orbital orchards."
 tr_lfg_stellar_harvest_star_lifting:0 "Star Lifting"
 tr_lfg_stellar_harvest_star_lifting_desc:0 "Matter lifted from the star boosts megastructure output, replacing planetary mines."
 tr_lfg_stellar_harvest_star_lifting_delayed:0 "Why dig for iron when the star is made of it?"
 tr_lfg_stellar_harvest_energy_credits:0 "Energy Credits"
 tr_lfg_stellar_harvest_energy_credits_desc:0 "Trade is denominated in stored starlight. Food production is neglected."
 tr_lfg_stellar_harvest_energy_credits_delayed:0 "One credit, one joule."
 tr_lfg_stellar_harvest_stellar_priority:0 "Stellar Priority"
 tr_lfg_stellar_harvest_stellar_priority_desc:0 "The next collector is always the most important project."
 tr_lfg_stellar_harvest_stellar_priority_delayed:0 "We will not stop until every photon is accounted for."
