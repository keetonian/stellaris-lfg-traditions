 # ======================= Council agendas =======================
 council_agenda_agenda_lfg_great_project_name:0 "The Great Project"
 council_agenda_agenda_lfg_great_project_desc:0 "The whole empire turns to a single goal: the next great work. Supertensile foundries run day and night; everything else waits."
 agenda_lfg_great_project_finish:0 "$council_agenda_agenda_lfg_great_project_name$"
 agenda_lfg_great_project_finish_desc:0 "$council_agenda_agenda_lfg_great_project_desc$"
 council_agenda_agenda_lfg_great_project_classic_name:0 "$council_agenda_agenda_lfg_great_project_name$"
 council_agenda_agenda_lfg_great_project_classic_desc:0 "The whole empire turns to a single goal: the next great work. Every resource is diverted to it; everything else waits."
 agenda_lfg_great_project_classic_finish:0 "$council_agenda_agenda_lfg_great_project_name$"
 agenda_lfg_great_project_classic_finish_desc:0 "$council_agenda_agenda_lfg_great_project_classic_desc$"
 council_agenda_agenda_lfg_grand_expedition_name:0 "Grand Expedition"
 council_agenda_agenda_lfg_grand_expedition_desc:0 "Every science ship, every scientist and half the laboratories are sent out into the dark to find what the ancients left behind."
 agenda_lfg_grand_expedition_finish:0 "$council_agenda_agenda_lfg_grand_expedition_name$"
 agenda_lfg_grand_expedition_finish_desc:0 "$council_agenda_agenda_lfg_grand_expedition_desc$"
 council_agenda_agenda_lfg_harvest_tithe_name:0 "The Harvest Tithe"
 council_agenda_agenda_lfg_harvest_tithe_desc:0 "Open the state granaries: §Y3,000§! £food£ Food (if we have it) is distributed as a grand tithe, earning §G150§! £influence£ Influence and §G2,000§! £unity£ Unity. Afterwards, farms produce more and the people are content."
 agenda_lfg_harvest_tithe_finish:0 "$council_agenda_agenda_lfg_harvest_tithe_name$"
 agenda_lfg_harvest_tithe_finish_desc:0 "The memory of the great tithe keeps the farms busy and the people calm."
 council_agenda_agenda_lfg_gala_season_name:0 "Gala Season"
 council_agenda_agenda_lfg_gala_season_desc:0 "A galaxy-wide season of premieres and galas. Our people are delighted; the markets are distracted."
 agenda_lfg_gala_season_finish:0 "$council_agenda_agenda_lfg_gala_season_name$"
 agenda_lfg_gala_season_finish_desc:0 "$council_agenda_agenda_lfg_gala_season_desc$"

 # ======================= Lab accident =======================

 council_agenda_agenda_lfg_grand_tour_season_name:0 "Grand Tour Season"
 council_agenda_agenda_lfg_grand_tour_season_desc:0 "Open our resort world to the galaxy for a decade-long tourist season. Our people are delighted and the trade flows; the work at home slows down."
 agenda_lfg_grand_tour_season_finish:0 "$council_agenda_agenda_lfg_grand_tour_season_name$"
 agenda_lfg_grand_tour_season_finish_desc:0 "$council_agenda_agenda_lfg_grand_tour_season_desc$"
 council_agenda_agenda_lfg_feast_of_plenty_name:0 "Feast of Plenty"
 council_agenda_agenda_lfg_feast_of_plenty_desc:0 "Declare a decade of feasting. Every bumper crop becomes a baby boom."
 agenda_lfg_feast_of_plenty_finish:0 "$council_agenda_agenda_lfg_feast_of_plenty_name$"
 agenda_lfg_feast_of_plenty_finish_desc:0 "$council_agenda_agenda_lfg_feast_of_plenty_desc$"
 agenda_lfg_feast_of_plenty_finish_tt:0 "Doubles §YBumper Crops§! (Abundance finisher): another §G+1%§! organic pop growth speed for every §Y1,000§! £food£ Food produced per month."
 council_agenda_agenda_lfg_storm_season_name:0 "Storm Season"
 council_agenda_agenda_lfg_storm_season_desc:0 "A decade of chasing the storms: our scientists fly into every front and our fields call them closer. Not everyone enjoys the weather."
 agenda_lfg_storm_season_finish:0 "$council_agenda_agenda_lfg_storm_season_name$"
 agenda_lfg_storm_season_finish_desc:0 "$council_agenda_agenda_lfg_storm_season_desc$"
