l_english:
 civic_lfg_applied_biosciences:0 "Applied Biosciences"
 councilor_lfg_applied_biosciences:0 "Chief Bioengineer"
 councilor_lfg_applied_biosciences_desc:0 "The $TITLE$ makes sure every discovery in our biology labs ends up in a reactor, a hull or an assembly line."
 civic_lfg_applied_biosciences_desc:0 "Our biologists don't study life for its own sake: every discovery is turned into new materials, fuels and machines as quickly as possible."
 origin_lfg_nanite_forge:0 "Nanite Forge"
 lfg_nanite_forge_start_NAME:0 "Nanite Forge"
 origin_lfg_nanite_forge_desc:0 "Our home system is a furnace of fire and metal, and in orbit above our homeworld hangs an ancient nanite harvester, damaged but still working. It has been seeding our system with nanites since before we woke."
 origin_tooltip_lfg_nanite_forge_effects:0 "- Start in a unique home system, rich in rocky worlds. §RNo additional habitable worlds are spawned nearby§!.\n- Starting homeworld: size §Y12§!, with §R-2,000§! pops.\n- Start with a broken ancient §YNanite Harvester§! on the home starbase.\n- Unlocks special nanite buildings, including §YNanite Freight§! to pay for planetary logistics with nanites.\n- Replicator jobs have an additional §R0.5§! £nanites£ Nanites upkeep."
 sm_lfg_broken_nanite_harvester:0 "Broken Nanite Harvester"
 sm_lfg_broken_nanite_harvester_plural:0 "Broken Nanite Harvesters"
 sm_lfg_broken_nanite_harvester_desc:0 "An ancient nanite harvester, damaged but still seeding this system with nanites."
 lfg_broken_nanite_harvester_tooltip:0 "$SYSTEM_EFFECTS_TXT$ $TABBED_NEW_LINE$ Every §Y3§! years, doubles the §Y$r_nanites$§! deposits of planets in this system that have a mining station, up to §Y12.8§! per planet. $TABBED_NEW_LINE$ Becomes the §YAncient Nanite Harvester§! when we finish the §YNanotech§! traditions."
 lfg_broken_nanite_harvester_not_buildable:0 "Can't be built: only our home system has one."
 building_lfg_nanite_automation:0 "Nanite Automation Hub"
 building_lfg_nanite_automation_desc:0 "Nanite swarms work our energy, mining and farming districts. Half cost on a §YNanite World§!."
 building_lfg_nanite_automation_effects:0 "§Y50%§! of Technician, Miner and Farmer jobs (and their drones) on this planet are automated."
 lfg_nanite_hub_automation:0 "Nanite Automation Hub"
 lfg_nanite_hub_automation_desc:0 "Nanite swarms do half the work of this planet's technicians, miners and farmers."
 lfg_nanite_hub_automation_tt:0 "Technician, Miner and Farmer jobs: §G50%§! automated"
 building_lfg_nanite_cognition_core:0 "Nanite Cognition Core"
 building_lfg_nanite_cognition_core_desc:0 "Thinking nanites do half our specialists' work. Half cost on a §YNanite World§!."
 building_lfg_nanite_cognition_core_effects:0 "§Y50%§! of every specialist and complex drone job on this planet is automated."
 lfg_nanite_specialist_automation:0 "Nanite Cognition Core"
 lfg_nanite_specialist_automation_desc:0 "Half the work of this planet's specialists is done by thinking nanites."
 lfg_nanite_specialist_automation_tt:0 "Specialist and complex drone jobs: §G50%§! automated"
 building_lfg_nanite_cognition_core_2:0 "Nanite Overmind Core"
 building_lfg_nanite_cognition_core_2_desc:0 "A planetary nanite mind that does all our specialists' work. Half cost on a §YNanite World§!."
 building_lfg_nanite_cognition_core_2_effects:0 "§Y100%§! of every specialist and complex drone job on this planet is automated."
 lfg_nanite_specialist_automation_full:0 "Nanite Overmind Core"
 lfg_nanite_specialist_automation_full_desc:0 "All the work of this planet's specialists is done by its nanite overmind."
 lfg_nanite_specialist_automation_full_tt:0 "Specialist and complex drone jobs: §G100%§! automated"
 tech_lfg_cognition_core_2:0 "Nanite Overmind"
 tech_lfg_cognition_core_2_desc:0 "The lessons of the Mothership's swarm mind, brought home: a Cognition Core can think for an entire world."
 d_lfg_nanite_forge_star:0 "£energy£ +22"
 d_lfg_nanite_forge_star_desc:0 "The forge's blue star pours out enough energy to feed a nanite harvester."
 building_lfg_nanite_freight_1:0 "Nanite Freight Relay"
 building_lfg_nanite_freight_1_desc:0 "Nanite swarms carry the planet's goods."
 building_lfg_nanite_freight_2:0 "Nanite Freight Network"
 building_lfg_nanite_freight_2_desc:0 "A denser web of nanite couriers."
 building_lfg_nanite_freight_3:0 "Nanite Freight Lattice"
 building_lfg_nanite_freight_3_desc:0 "Nanites move every cargo on the planet."
 tech_lfg_nanite_freight_1:0 "Nanite Freight"
 tech_lfg_nanite_freight_1_desc:0 "Nanites can carry what our pops cannot: let them move our goods."
 tech_lfg_nanite_freight_2:0 "Nanite Freight Networks"
 tech_lfg_nanite_freight_2_desc:0 "Linking freight relays into planet-wide networks."
 tech_lfg_nanite_freight_3:0 "Nanite Freight Lattices"
 tech_lfg_nanite_freight_3_desc:0 "A lattice of couriers in every structure of a world."
 tech_lfg_nanite_automation:0 "Nanite Automation"
 tech_lfg_nanite_automation_desc:0 "Our nanites can run a planet's mines, farms and power plants with only a little guidance."
 tech_lfg_nanite_cognition_core:0 "Nanite Cognition"
 tech_lfg_nanite_cognition_core_desc:0 "Nanite swarms that think together can take on the work of a planet's specialists."
 tech_lfg_nanite_consensus_1:0 "Nanite Consensus"
 tech_lfg_nanite_consensus_1_desc:0 "Nanites that share what they learn can share what we believe."
 tech_lfg_nanite_consensus_2:0 "Consensus Arrays"
 tech_lfg_nanite_consensus_2_desc:0 "Linking consensus nodes into arrays that think as one."
 tech_lfg_nanite_consensus_3:0 "Consensus Lattices"
 tech_lfg_nanite_consensus_3_desc:0 "A lattice of nanite consensus woven through a world."
 tech_lfg_nanite_consensus_4:0 "Consensus Cores"
 tech_lfg_nanite_consensus_4_desc:0 "The consensus becomes a core of the empire's will."
 building_lfg_nanotensile_converter:0 "Nanotensile Converter"
 building_lfg_nanotensile_converter_desc:0 "Energy-fed nanite swarms weave themselves into supertensiles."
 building_lfg_nanotensile_converter_2:0 "Nanotensile Foundry"
 building_lfg_nanotensile_converter_2_desc:0 "Denser swarms, twice the supertensiles."
 sm_lfg_ancient_nanite_harvester:0 "Ancient Nanite Harvester"
 sm_lfg_ancient_nanite_harvester_plural:0 "Ancient Nanite Harvesters"
 sm_lfg_ancient_nanite_harvester_desc:0 "Restored with what we learned of nanotechnology, the ancient harvester works as its makers intended, far beyond any harvester we could build."
 lfg_ancient_nanite_harvester_tooltip:0 "$SYSTEM_EFFECTS_TXT$ $TABBED_NEW_LINE$ Every §Y3§! years, doubles the §Y$r_nanites$§! deposits of planets in this system that have a mining station, up to §Y6,553.6§! per planet (planet size limits apply)."
 d_lfg_nanite_harvester_deposit_huge:0 "Nanotech Deposit 4"
 d_lfg_nanite_harvester_deposit_huge_desc:0 "$d_lfg_nanite_harvester_deposit_huge$"
 d_lfg_nanite_harvester_deposit_vast:0 "Nanotech Deposit 5"
 d_lfg_nanite_harvester_deposit_vast_desc:0 "$d_lfg_nanite_harvester_deposit_vast$"
 lfg_requires_no_ancient_harvester:0 "This starbase already has our §YAncient Nanite Harvester§!."
 building_lfg_nanite_consensus_1:0 "Nanite Consensus Node"
 building_lfg_nanite_consensus_1_desc:0 "A node where nanite swarms share what they learn, binding our network a little tighter."
 building_lfg_nanite_consensus_2:0 "Nanite Consensus Array"
 building_lfg_nanite_consensus_2_desc:0 "Linked nodes, thinking as one array."
 building_lfg_nanite_consensus_3:0 "Nanite Consensus Lattice"
 building_lfg_nanite_consensus_3_desc:0 "A planet-spanning lattice of thinking nanites."
 building_lfg_nanite_consensus_4:0 "Nanite Consensus Core"
 building_lfg_nanite_consensus_4_desc:0 "The heart of the planet's nanite mind, in tune with the whole empire."
 START_SCREEN_LFG_NANITE_FORGE:0 "We woke on [Root.Capital.GetName] beneath the glow of an ancient machine. Long before our first thought, a harvester left by makers we never knew had been seeding our system with nanites, and in time those nanites became us.\n\nThe harvester is broken now, but it still works, and every few years the deposits around our home grow richer. Our world is small and our numbers few; the worlds that matter here are the great molten spheres of the forge, not gardens to settle.\n\nIf we can learn to mend what our makers left behind, there is no limit to what the swarm can build."
 trait_lfg_nanite_substrate:0 "Nanite Substrate"
 trait_lfg_nanite_substrate_desc:0 "Every unit of this species is woven through with nanites. They work tirelessly, but must be fed fresh nanites, and the swarm grows new bodies slowly. Cannot be removed.\n\nPop upkeep: §R+0.3§! £nanites£ Nanites (per 100 pops)\nMechanical pop assembly speed: §R-30%§!\nNeither on a §YNanite World§!."
 d_lfg_nanite_vein:0 "Nanite Vein"
 d_lfg_nanite_vein_desc:0 "Nanites seeded by the ancient harvester have woven themselves deep into this world's crust."
 origin_lfg_sealed_ring:0 "Swallowed Whole"
 lfg_sealed_ring_start_NAME:0 "Swallowed Ring"
 origin_lfg_sealed_ring_desc:0 "Our ring world once circled a star in the galaxy - until a Tiyanki Matriarch of impossible size swallowed it whole. Ages later she spat it out far beyond the rim, its sections sealed under her hardened residue."
 origin_tooltip_lfg_sealed_ring_effects:0 "- Start on an intact §YRing World§! far beyond the galactic rim.\n- Start with §Rno ships§!.\n- The ring is sealed by §YLeviathan Residue§!.\n- One neighbouring system, and §Rno habitable worlds outside the ring§!.\n- The §RLegendary Tiyanki Matriarch§! lurks somewhere beyond the rim."
 START_SCREEN_LFG_SEALED_RING:0 "We remember the sky going dark. A Tiyanki Matriarch larger than any world - larger than our whole ring - swallowed [Root.Capital.GetName] and everything on it, and for longer than our records can tell we lived inside her.\n\nThen she let us go. We woke far beyond the stars of the galaxy, our ring whole but its sections sealed under the residue of her gut. A single hyperlane leads to a lonely star where her herd still grazes; past it, in the dark, she waits.\n\nSomewhere beneath the residue lies the knowledge to cross the void. We will scrape every seal away - and one day, we will repay her."
 d_lfg_sealed_section:0 "Leviathan Residue"
 d_lfg_sealed_section_desc:0 "A ring section sealed under the hardened residue of the Matriarch's gut. It still feeds a little life, but it makes the ring harder to live on. Cutting it away will give us room to build - and whatever she swallowed along with us."
 d_lfg_sealed_ring_negative_mass:0 "£giga_sr_negative_mass£ §Y+5§!"
 d_lfg_sealed_ring_negative_mass_desc:0 "Something in the Matriarch's gut gathers Quasi-Negative Mass. This lump of it still does."
 tech_lfg_sealed_ring_drive:0 "Void Leap Drive"
 tech_lfg_sealed_ring_drive_desc:0 "Jump drives tuned to the way the Matriarch crosses the void between the galaxy and its rim: leaps more than twice as long as any known drive can make."
 lfg_sealed_ring.3.name:0 "The Last Seal"
 lfg_sealed_ring.3.desc:0 "The last of the Matriarch's residue has been cut away from [Root.Capital.GetName]'s ring. Beneath it lay the wrecks of other things she swallowed - and among them, intact navigation cores that recorded her every crossing of the void.\n\nWith them, the galaxy is no longer out of reach."
 lfg_sealed_ring.3.a:0 "Plot a course home."
 lfg_sealed_ring.4.name:0 "The Matriarch Falls"
 lfg_sealed_ring.4.desc:0 "The Legendary Tiyanki Matriarch is dead. The leviathan that once swallowed a ring world whole drifts lifeless in the dark, her vast body open to our scientists.\n\nHer genes carry the secret of her kind's endless budding."
 lfg_sealed_ring.4.a:0 "She will feed us now."
 lfg_sealed_ring.4.a.tt:0 "Our species can gain the §YPolymelic§! trait through genetic modification (once we can modify §YLeviathan Traits§!: the Mutation tradition §YNucleotide Isolation§!, or Genetics finished with §YAllelic Expression§!)."
 NAME_lfg_legendary_matriarch:0 "Legendary Tiyanki Matriarch"
 lfg_legendary_matriarch:0 "Legendary Matriarch"
 lfg_legendary_matriarch_desc:0 "The leviathan that swallowed a ring world whole."
 lfg_whale_road_digsite:0 "The Whale Road"
 lfg_whale_road_digsite_desc:0 "Scars in the crust of this molten world trace the path of the Matriarch who swallowed our ring. Following them back will be slow, hard work - but they lead somewhere."
 lfg_sealed_ring.10.name:0 "The Whale Road: Feeding Scars"
 lfg_sealed_ring.10.desc:0 "Our team has mapped the first of the great furrows the Matriarch carved into [From.Planet.GetName] as she fed. Its pattern matches nothing in our records of Tiyanki behaviour: she did not graze here. She was searching."
 lfg_sealed_ring.10.a:0 "Keep digging."
 lfg_sealed_ring.11.name:0 "The Whale Road: Shed Plates"
 lfg_sealed_ring.11.desc:0 "Buried under cooled lava, [From.Leader.GetName] has found plates of the Matriarch's hide, shed as she grew. Each is larger than a frigate, and each still bends the space around it ever so slightly."
 lfg_sealed_ring.11.a:0 "Study them."
 lfg_sealed_ring.12.name:0 "The Whale Road: Swallowed Things"
 lfg_sealed_ring.12.desc:0 "Deeper down lie the remains of things the Matriarch swallowed before our ring - and spat out here. Hulls of ships no one has built in a million years, still bearing the scars of her gut."
 lfg_sealed_ring.12.a:0 "Salvage what we can."
 lfg_sealed_ring.13.name:0 "The Whale Road: Urmazin Markers"
 lfg_sealed_ring.13.desc:0 "We are not the first to dig here. Small beacons, unmistakably Urmazin, mark the trail at regular intervals. They have been following the Matriarch's road for generations - and they never told us where it led."
 lfg_sealed_ring.13.a:0 "Of course they didn't."
 lfg_sealed_ring.14.name:0 "The Whale Road: Her Song"
 lfg_sealed_ring.14.desc:0 "At the bottom of the deepest furrow, our instruments pick up a faint, regular pulse: the Matriarch's song, echoing through a fold in space she left open behind her. It comes from somewhere further out in the dark."
 lfg_sealed_ring.14.a:0 "Find the fold."
 lfg_sealed_ring.15.name:0 "The End of the Whale Road"
 lfg_sealed_ring.15.desc:0 "[From.Leader.GetName] has found the fold: a passage the Matriarch tore through space on her way home, healed over but never closed. With enough power we can force it open again.\n\nOn the other side lies her feeding ground - warm, rich, and guarded by the largest living thing we have ever seen.\n\nAnd as the fold opens, a ship slips out of it: Urmazin traders, who have followed the Matriarch for generations. They have known where we were all along - and they would very much like to buy our Quasi-Negative Mass."
 lfg_sealed_ring.15.a:0 "Open the way."
 lfg_sealed_ring.15.a.tt:0 "A §Ywormhole§! opens between this system and the §RLegendary Tiyanki Matriarch§!'s.\nWe gain §Y25%§! progress in §YWormhole Stabilization§! (needed to use it) if we haven't researched it yet."
 NAME_lfg_matriarch_cradle:0 "Matriarch's Cradle"
 lfg_sealed_ring.15.urmazin_tt:0 "We establish contact with the §YUrmazin Traders§!, who buy §YQuasi-Negative Mass§!."
 d_lfg_sealed_section_research_tt:0 "§Y10%§! progress in a random new research option"
 lfg_legendary_matriarch_plural:0 "Legendary Matriarchs"
 lfg_sealed_ring.4.b:0 "She will rise again - for us."
 LFG_REANIMATE_LEGENDARY_MATRIARCH:0 "Reanimate the Legendary Matriarch"
 LFG_REANIMATE_LEGENDARY_MATRIARCH_DESC:0 "Our [Owner.GetNecromancersLower] believe that even the leviathan who swallowed a ring world can be made to serve. A long ritual beside her corpse will tell."
 lfg_sealed_ring.16.name:0 "The Matriarch Rises"
 lfg_sealed_ring.16.desc:0 "The ritual is complete. The Legendary Tiyanki Matriarch stirs in the dark, her vast body knitting itself back together - and when she turns towards our ships, it is not to feed.\n\nThe leviathan that once swallowed our world now swims at our command."
 lfg_sealed_ring.16.a:0 "It hungers."
 lfg_reanimated_legendary_matriarch:0 "Legendary Remnant"
 lfg_reanimated_legendary_matriarch_desc:0 "Something of the Legendary Matriarch's strength survived her death."
