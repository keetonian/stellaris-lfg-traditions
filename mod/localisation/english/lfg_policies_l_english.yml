l_english:
 policy_lfg_monument_economy:0 "Monument Economy"
 policy_lfg_monument_economy_desc:0 "Each megastructure we own reshapes our economy. Do the great works come first, or the people who live beneath them?"
 lfg_monument_economy_balanced:0 "Balanced"
 lfg_monument_economy_balanced_name:0 "Balanced"
 lfg_monument_economy_balanced_desc:0 "The great works and the worlds around them are left to find their own balance.\nNo effect."
 lfg_monument_economy_monuments_first:0 "Monuments First"
 lfg_monument_economy_monuments_first_name:0 "Monuments First"
 lfg_monument_economy_monuments_first_desc:0 "Labour is drawn away to staff the great works.\nFor each megastructure we own: megastructure output §G+1%§!, job output §R-0.5%§!."
 lfg_monument_economy_people_first:0 "People First"
 lfg_monument_economy_people_first_name:0 "People First"
 lfg_monument_economy_people_first_desc:0 "The great works serve the worlds around them.\nFor each megastructure we own: job output §G+0.5%§!, megastructure output §R-1%§!."
 policy_lfg_nanite_conversion:0 "Nanite Conversion"
 policy_lfg_nanite_conversion_desc:0 "The Forge's nanites can be put to other work: building monuments to our cause, or running experiments no laboratory could."
 lfg_nanite_conversion_none:0 "Raw Nanites"
 lfg_nanite_conversion_none_name:0 "Raw Nanites"
 lfg_nanite_conversion_none_desc:0 "Every nanite the Forge makes is kept as it is.\nNo effect."
 lfg_nanite_conversion_unity:0 "Unity Focus"
 lfg_nanite_conversion_unity_name:0 "Unity Focus"
 lfg_nanite_conversion_unity_desc:0 "A share of the swarm is shaped into monuments, murals and ceremonies.\nEvery month, §Y10%§! of our £nanites£ §YNanite§! production is turned into the same amount of £unity£ §YUnity§!."
 lfg_nanite_conversion_research:0 "Research Focus"
 lfg_nanite_conversion_research_name:0 "Research Focus"
 lfg_nanite_conversion_research_desc:0 "A share of the swarm becomes self-assembling laboratories.\nEvery month, §Y5%§! of our £nanites£ §YNanite§! production is turned into the same amount of £physics£ §YPhysics§!, £society£ §YSociety§! and £engineering£ §YEngineering§! research each."
