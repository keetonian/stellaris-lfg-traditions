l_english:
 ap_lfg_curated_progress:0 "Curated Progress"
 ap_lfg_curated_progress_desc:0 "Not every breakthrough is worth chasing. Our research councils may strike whole lines of incremental study from the agenda, so our scientists spend their time on the work that matters.\n\nUnlocks §YShelve§! edicts: each one stops a specific repeatable technology from being offered as a research option."
 ap_lfg_curated_progress_tt:0 "Unlocks §YShelve§! edicts for every repeatable technology (one per technology; Gigastructural's megastructure capacity repeatables are grouped by research area).\nEach costs §Y2,000§! £unity£ Unity and §Y200§! £influence£ Influence to enact and §Y300§! monthly research of the shelved technology's type, scaled by empire size."
 ap_lfg_massed_assault:0 "Massed Assault"
 ap_lfg_massed_assault_desc:0 "A planet is not taken one regiment at a time. Our doctrine commits every army at once, on every front, until the defenders are simply overwhelmed.\n\nMore of our armies fight at the same time in ground combat, and every general is trained in the doctrine."
 ap_lfg_massed_assault_tt:0 "All our generals gain the §YMassed Assault Doctrine§! trait: armies they lead get damage §G+25%§!, health §G+25%§! and morale §G+50%§!."
 lfg_requires_ascension_perks_4:0 "$TRIGGER_FAIL$Requires four other Ascension Perks to be selected first."
 ap_lfg_nanite_armada:0 "Nanite Armada"
 ap_lfg_nanite_armada_desc:0 "Why carve warships from dead moons when nanites can grow them from nothing? Given enough nanites, a forge around a great star can assemble moons and planets that fight."
 ap_lfg_nanite_armada_tt:0 "Adds three £engineering£ §YEngineering§! research options:\n- §YSwarmforge§!: a megastructure built around a §Yclass A§! or §Yclass B§! star or a §Yred giant§!.\n- §YNanite Attack Moon§! (£nanites£ §Y500,000§!) and §YNanite Planetcraft§! (£nanites£ §Y1,000,000§!): only built at a Swarmforge, and can be designed in the ship designer."
 tech_lfg_swarmforge:0 "Swarmforge"
 tech_lfg_swarmforge_desc:0 "Nanite swarms fed by the full output of a great star can assemble anything - even warships the size of worlds."
 tech_lfg_nanite_war_moon:0 "Nanite Attack Moons"
 tech_lfg_nanite_war_moon_desc:0 "A moon's worth of nanites, held together by will alone, with a moon's worth of guns."
 tech_lfg_nanite_planetcraft:0 "Nanite Planetcraft"
 tech_lfg_nanite_planetcraft_desc:0 "A planet-sized swarm that thinks, moves and fights as one."
 lfg_swarmforge_0:0 "Swarmforge Site"
 lfg_swarmforge_0_DESC:0 "Collector arrays are being set up around the star, ready to feed the first nanite swarms."
 lfg_swarmforge_0_MEGASTRUCTURE_DETAILS:0 "A shipyard the size of a solar system, where nanite swarms fed by a great star assemble §YNanite Attack Moons§! and §YNanite Planetcraft§!. Can only be built around a §Yclass A§! or §Yclass B§! star or a §Yred giant§!."
 lfg_swarmforge_ready:0 "Swarmforge"
 lfg_swarmforge_ready_DESC:0 "Clouds of nanites, fed by the star, weave hulls the size of moons and planets. The only shipyard that can build our nanite celestial warships."
 lfg_requires_swarmforge:0 "Can only be built at a §YSwarmforge§! or §YProgenitor Forge§!."
 lfg_requires_swarmforge_star:0 "Requires a §Yclass A§! or §Yclass B§! star or a §Yred giant§!."
 lfg_nanite_war_moon:0 "Nanite Attack Moon"
 lfg_nanite_war_moon_plural:0 "Nanite Attack Moons"
 lfg_nanite_war_moon_cap:0 "Nanite Attack Moon"
 lfg_nanite_planetcraft:0 "Nanite Planetcraft"
 lfg_nanite_planetcraft_plural:0 "Nanite Planetcraft"
 lfg_nanite_planetcraft_cap:0 "Nanite Planetcraft"
 ap_lfg_mothership:0 "Mothership"
 ap_lfg_mothership_desc:0 "Moons and planets were only the beginning. Around the hottest stars, our swarms can build a ship the size of a star system that births swarms of its own."
 ap_lfg_mothership_tt:0 "Adds two £engineering£ §YEngineering§! research options: the §YProgenitor Forge§!, a megastructure built around an §YO-class star§!, and the §YMothership§!, which only it can build."
 lfg_requires_ap_nanite_armada:0 "Requires the §YNanite Armada§! ascension perk."
 lfg_requires_ap_celestial_armada:0 "Requires the §YA Celestial Armada§! ascension perk."
 tech_lfg_progenitor_forge:0 "Progenitor Forge"
 tech_lfg_progenitor_forge_desc:0 "Only the fury of an O-class star can feed swarms large enough to build a mothership."
 tech_lfg_mothership:0 "Motherships"
 tech_lfg_mothership_desc:0 "A swarm the size of a star system, carrying worlds and birthing endless nanite fighters."
 lfg_progenitor_forge_0:0 "Progenitor Forge Site"
 lfg_progenitor_forge_0_DESC:0 "Collectors are being set around the blue giant, ready to drink its light."
 lfg_mothership.10.name:0 "The Forge Feeds"
 lfg_mothership.10.desc:0 "The Progenitor Forge's site is complete, and its first swarms are hungry. Every world, moon and rock around the star has been taken apart, leaving the system bare but for the star and what we have built.\n\nWe have gained §Y[Root.lfg_forge_bulk_matter]§! bulk matter."
 lfg_mothership.10.a:0 "Nothing will be wasted."
 lfg_mothership.11.name:0 "The Forge Rises"
 lfg_mothership.11.desc:0 "The second stage of the Progenitor Forge is complete. Rings of nanite stations now circle the blue giant, drinking its light, and clouds of swarms drift between them, waiting for work worthy of them."
 lfg_mothership.11.a:0 "Only one stage remains."
 lfg_mothership.12.name:0 "The Progenitor Forge"
 lfg_mothership.12.desc:0 "The Progenitor Forge is complete. Fed by an O-class star, its yards and swarms can now assemble the greatest thing our nanites have ever built: a §YMothership§!."
 lfg_mothership.12.a:0 "Begin."
 lfg_mothership.14.name:0 "The Mothership Awakens"
 lfg_mothership.14.desc:0 "Our Mothership has left the Progenitor Forge: a ship the size of a star system, wrapped in its own swarm. Wherever it goes, our fleets move faster and strike harder, and its brood follows it into every battle."
 lfg_mothership.14.a:0 "Let the galaxy see it."
 lfg_progenitor_forge_0_MEGASTRUCTURE_DETAILS:0 "Turns an §YO-class star's§! output into nanite swarms vast enough to assemble §YMotherships§!. Built in three stages, £nanites£ §Y50,000,000§! in all."
 lfg_progenitor_forge_1:0 "Progenitor Forge Frame"
 lfg_progenitor_forge_1_DESC:0 "The first swarms circle the star, building the forge that will build the forge."
 lfg_progenitor_forge_2:0 "Progenitor Forge"
 lfg_progenitor_forge_2_DESC:0 "Fed by an O-class star, its swarms assemble Motherships: ships the size of star systems. The only shipyard that can build them; it also builds Nanite Attack Moons and Planetcraft, up to §Y300§! ships at once."
 lfg_requires_o_star:0 "Must be built around an §YO-class star§!."
 lfg_requires_progenitor_forge:0 "Can only be built at a §YProgenitor Forge§!."
 lfg_mothership:0 "Mothership"
 lfg_mothership_plural:0 "Motherships"
 lfg_mothership_cap:0 "Mothership"
 LFG_NANITE_SWARM_HANGAR:0 "Nanite Swarm Hangar"
 LFG_NANITE_SWARM_HANGAR_DESC:0 "Launches swarms of self-repairing nanite fighters that tear through shields and armour alike. Motherships only."
 LFG_MOTHERSHIP_REACTOR:0 "Mothership Swarm Core"
 LFG_MOTHERSHIP_REACTOR_DESC:0 "Powers the Mothership and links every friendly ship in its system to its swarm."
 lfg_mothership_swarm_link:0 "Swarm Link"
 lfg_mothership_swarm_link_desc:0 "Linked to a Mothership's swarm: faster ships and faster-firing kinetic weapons."
 LFG_NANITE_RESHAPER:0 "Nanite Reshaper"
 LFG_NANITE_RESHAPER_DESC:0 "A Reshaping Projectile Accelerator rebuilt at titanic scale from nanites. Each slug reforms mid-flight to punch through shields and armour. Motherships only."
 LFG_NANITE_SIEGE_DRIVER:0 "Nanite Siege Driver"
 LFG_NANITE_SIEGE_DRIVER_DESC:0 "A spinal mass driver grown from the Mothership's own swarm. Its planet-cracking slugs are nanite colonies that keep eating through whatever they hit. Motherships, and up to three on a Maginot World."
 LFG_NANITE_SIEGE_DRIVER_MAGINOT:0 "$LFG_NANITE_SIEGE_DRIVER$"
 LFG_NANITE_SIEGE_DRIVER_MAGINOT_DESC:0 "$LFG_NANITE_SIEGE_DRIVER_DESC$"
 lfg_nanite_siege_driver_on_hit_tt:0 "Deals §Y7,500 - 15,000§! damage to all hostile ships within §E45§! range of the target."
 lfg_nanite_siege_driver_debuff:0 "Nanite Infestation"
 lfg_nanite_siege_driver_debuff_desc:0 "Nanites from a Siege Driver slug are eating through this ship's armour and shield emitters."
 LFG_NANITE_FLAK_SWARM:0 "Nanite Flak Swarm"
 LFG_NANITE_FLAK_SWARM_DESC:0 "Fills the space around the hull with a cloud of nanites that strips incoming missiles and strike craft apart before they come close. Motherships and Maginot Worlds only."
 LFG_NANITE_DISASSEMBLER:0 "Nanite Disassembler"
 LFG_NANITE_DISASSEMBLER_DESC:0 "Unleashes the Mothership's swarm on a world, cracking it apart and taking it in: §Y+5,000§! £nanites£ Nanites per size of the world and §Y+5§! per pop on it. Motherships only."
 LFG_NANITE_STORM_AUTOCANNON:0 "Nanite Storm Autocannon"
 LFG_NANITE_STORM_AUTOCANNON_DESC:0 "The Nanite Autocannon, rebuilt by the Mothership's swarm: its self-guiding nanite rounds hold together four times as far and hit harder. Nanite ships only."
 mod_lfg_mothership_swarmer_storage_add:0 "Nanite Swarmer Storage"
 mod_lfg_mothership_swarmers_per_month_add:0 "Nanite Swarmers Assembled per Month"
 mod_lfg_mothership_interdictor_storage_add:0 "Nanite Interdictor Storage"
 mod_lfg_mothership_interdictors_per_month_add:0 "Nanite Interdictors Assembled per Month"
 LFG_SWARMER_VAULT:0 "Swarmer Hive Vault"
 LFG_SWARMER_VAULT_DESC:0 "Stores §Y+100§! more Nanite Swarmers in the Mothership's reserve. Stacks with every module fitted. Motherships only."
 LFG_SWARMER_FOUNDRY:0 "Swarmer Foundry"
 LFG_SWARMER_FOUNDRY_DESC:0 "Assembles §Y+20§! more Nanite Swarmers a month for the Mothership's reserve. Stacks with every module fitted. Motherships only."
 LFG_INTERDICTOR_VAULT:0 "Interdictor Hive Vault"
 LFG_INTERDICTOR_VAULT_DESC:0 "Stores §Y+40§! more Nanite Interdictors in the Mothership's reserve. Stacks with every module fitted. Motherships only."
 LFG_INTERDICTOR_FOUNDRY:0 "Interdictor Foundry"
 LFG_INTERDICTOR_FOUNDRY_DESC:0 "Assembles §Y+6§! more Nanite Interdictors a month for the Mothership's reserve. Stacks with every module fitted. Motherships only."
 LFG_NANITE_ARMOR:0 "Nanite Armour"
 LFG_NANITE_ARMOR_DESC:0 "Self-repairing nanite plating. The swarm in each plate also feeds and cools the kinetic batteries, raising their fire rate."
 LFG_LM_ACCELERATOR_2:0 "Symbiotic $LM_ACCELERATOR$"
 LFG_LM_ACCELERATOR_2_DESC:0 "Living metal in closer symbiosis reshapes each slug faster and harder than ever, tearing deep into armour."
 LFG_LM_ARMOR_6:0 "Symbiotic Galvanic Armour"
 LFG_SMALL_LM_ARMOR_6:0 "Small $LFG_LM_ARMOR_6$"
 LFG_SMALL_LM_ARMOR_6_DESC:0 "$LFG_LM_ARMOR_6_DESC$"
 LFG_MEDIUM_LM_ARMOR_6:0 "Medium $LFG_LM_ARMOR_6$"
 LFG_MEDIUM_LM_ARMOR_6_DESC:0 "$LFG_LM_ARMOR_6_DESC$"
 LFG_LARGE_LM_ARMOR_6:0 "Large $LFG_LM_ARMOR_6$"
 LFG_LARGE_LM_ARMOR_6_DESC:0 "$LFG_LM_ARMOR_6_DESC$"
 LFG_LM_ARMOR_6_DESC:0 "Living metal grown into a denser lattice: thicker, harder and quicker to heal."
 tech_lfg_lm_accelerator_2:0 "Symbiotic Accelerators"
 tech_lfg_lm_accelerator_2_desc:0 "Deeper symbiosis with the living metal lets the Reshaping Projectile Accelerator reform each slug faster and harder."
 tech_lfg_lm_armor_6:0 "Symbiotic Galvanic Armour"
 tech_lfg_lm_armor_6_desc:0 "Coaxing living metal into denser lattices makes it thicker, harder and faster to regrow."
 lfg_mothership_limit:0 "Only §Yone Mothership§! per empire."
 lfg_requires_mothership_crew:0 "Needs a crew of §Y2,000§! pops: take the §YCrew the Mothership§! decision on a world."
 decision_lfg_mothership_crew:0 "Crew the Mothership"
 decision_lfg_mothership_crew_desc:0 "Send 2,000 of this world's people to live aboard the Mothership and guide its swarms."
 lfg_mothership_crew_effect_tt:0 "§R2,000§! pops leave this world to crew our next §YMothership§!."
 lfg_mothership_crew_needs_pops:0 "Needs more than §Y2,000§! pops on this world."
 lfg_mothership_escort_fleet:0 "Mothership Escort"
 lfg_requires_nanotech_adopted:0 "Requires the §YNanotech§! traditions to be adopted."
 lfg_requires_nanotech_finished:0 "Requires the §YNanotech§! traditions to be finished."
 lfg_allow_swarmforge:0 "§HUnlocks Megastructure:§! Swarmforge"
 lfg_allow_swarmforge_desc:0 "A giant nanite shipyard built around a §Yclass A§! or §Yclass B§! star or a §Yred giant§!: the only place §YNanite Attack Moons§! and §YNanite Planetcraft§! can be built."
 lfg_allow_swarmforge_ships:0 "§HBuilt at:§! Swarmforge, Progenitor Forge"
 lfg_allow_swarmforge_ships_desc:0 "Paid in £nanites£ Nanites, built only at a §YSwarmforge§! or §YProgenitor Forge§!, and designable in the ship designer."
 lfg_allow_progenitor_forge:0 "§HUnlocks Megastructure:§! Progenitor Forge"
 lfg_allow_progenitor_forge_desc:0 "Built around an §YO-class star§! in three stages: the only place §YMotherships§! can be built."
 lfg_allow_mothership_forge:0 "§HBuilt at:§! Progenitor Forge"
 lfg_allow_mothership_forge_desc:0 "Paid in £nanites£ Nanites, built only at a §YProgenitor Forge§!, and designable in the ship designer."
 lfg_allow_mothership_escort:0 "§HEscort:§! Nanite Swarmers and Interdictors"
 lfg_allow_mothership_escort_desc:0 "A Mothership builds up a reserve of §Y80§! Nanite Swarmers and §Y20§! Nanite Interdictors a month (up to §Y600§! / §Y200§!). In battle it deploys them as an escort that follows it and takes no naval capacity; once no enemy is left in the system, the survivors return."
 lfg_allow_mothership_components:0 "§HUnlocks Components:§! Nanite weapons, armour, hangars and swarm modules"
 lfg_allow_mothership_components_desc:0 "Nanite weapons, armour, hangars and swarm modules for the Mothership and other nanite ships."
