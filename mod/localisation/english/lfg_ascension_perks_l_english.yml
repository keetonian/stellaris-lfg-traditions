l_english:
 ap_lfg_curated_progress:0 "Curated Progress"
 ap_lfg_curated_progress_desc:0 "Not every breakthrough is worth chasing. Our research councils may strike whole lines of incremental study from the agenda, so our scientists spend their time on the work that matters.\n\nUnlocks §YShelve§! edicts: each one stops a specific repeatable technology from being offered as a research option."
 ap_lfg_curated_progress_tt:0 "Unlocks §YShelve§! edicts for every repeatable technology (one per technology; Gigastructural's megastructure capacity repeatables are grouped by research area).\nEach costs §Y2,000§! £unity£ Unity and §Y200§! £influence£ Influence to enact and §Y300§! monthly research of the shelved technology's type, scaled by empire size."
 ap_lfg_massed_assault:0 "Massed Assault"
 ap_lfg_massed_assault_desc:0 "A planet is not taken one regiment at a time. Our doctrine commits every army at once, on every front, until the defenders are simply overwhelmed.\n\nMore of our armies fight at the same time in ground combat, and every general is trained in the doctrine."
 ap_lfg_massed_assault_tt:0 "All our generals gain the §YMassed Assault Doctrine§! trait: armies they lead get damage §G+25%§!, health §G+25%§! and morale §G+50%§!."
 lfg_requires_ascension_perks_4:0 "$TRIGGER_FAIL$Requires four other Ascension Perks to be selected first."
 ap_lfg_nanite_armada:0 "Nanite Armada"
 ap_lfg_nanite_armada_desc:0 "Why carve warships from dead moons when nanites can grow them from nothing? Given enough nanites, a forge around a great star can assemble moons and planets that fight."
 ap_lfg_nanite_armada_tt:0 "Adds three £engineering£ §YEngineering§! research options:\n- §YSwarmforge§!: a megastructure built around a §Yclass A§! or §Yclass B§! star or a §Yred giant§!.\n- §YNanite Attack Moon§! (£nanites£ §Y500,000§!) and §YNanite Planetcraft§! (£nanites£ §Y1,000,000§!): only built at a Swarmforge, and can be designed in the ship designer."
 tech_lfg_swarmforge:0 "Swarmforge"
 tech_lfg_swarmforge_desc:0 "Nanite swarms fed by the full output of a great star can assemble anything - even warships the size of worlds."
 tech_lfg_nanite_war_moon:0 "Nanite Attack Moons"
 tech_lfg_nanite_war_moon_desc:0 "A moon's worth of nanites, held together by will alone, with a moon's worth of guns."
 tech_lfg_nanite_planetcraft:0 "Nanite Planetcraft"
 tech_lfg_nanite_planetcraft_desc:0 "A planet-sized swarm that thinks, moves and fights as one."
 lfg_swarmforge_0:0 "Swarmforge Site"
 lfg_swarmforge_0_DESC:0 "Collector arrays are being set up around the star, ready to feed the first nanite swarms."
 lfg_swarmforge_0_MEGASTRUCTURE_DETAILS:0 "A shipyard the size of a solar system, where nanite swarms fed by a great star assemble §YNanite Attack Moons§! and §YNanite Planetcraft§!. Can only be built around a §Yclass A§! or §Yclass B§! star or a §Yred giant§!."
 lfg_swarmforge_ready:0 "Swarmforge"
 lfg_swarmforge_ready_DESC:0 "Clouds of nanites, fed by the star, weave hulls the size of moons and planets. The only shipyard that can build our nanite celestial warships."
 lfg_requires_swarmforge:0 "Can only be built at a §YSwarmforge§!."
 lfg_requires_swarmforge_star:0 "Requires a §Yclass A§! or §Yclass B§! star or a §Yred giant§!."
 lfg_nanite_war_moon:0 "Nanite Attack Moon"
 lfg_nanite_war_moon_plural:0 "Nanite Attack Moons"
 lfg_nanite_war_moon_cap:0 "Nanite Attack Moon"
 lfg_nanite_planetcraft:0 "Nanite Planetcraft"
 lfg_nanite_planetcraft_plural:0 "Nanite Planetcraft"
 lfg_nanite_planetcraft_cap:0 "Nanite Planetcraft"
 ap_lfg_mothership:0 "Mothership"
 ap_lfg_mothership_desc:0 "Moons and planets were only the beginning. Around the hottest stars, our swarms can build a ship the size of a star system that births swarms of its own."
 ap_lfg_mothership_tt:0 "Adds two £engineering£ §YEngineering§! research options:\n- §YProgenitor Forge§!: a megastructure built around an §YO-class star§!, in three stages (£nanites£ §Y50,000,000§! in all).\n- §YMothership§! (£nanites£ §Y100,000,000§!): stronger than a systemcraft, with §Y45§! hangars for the new §YNanite Swarm§! strike craft. Each month its escort, which follows it and takes no naval capacity, gains up to §Y80§! Nanite Swarmers and §Y20§! Nanite Interdictors (up to §Y200§! / §Y100§!; needs the §YNanotech§! traditions that unlock them). Only built at a Progenitor Forge."
 lfg_requires_ap_nanite_armada:0 "Requires the §YNanite Armada§! ascension perk."
 lfg_requires_ap_celestial_armada:0 "Requires the §YA Celestial Armada§! ascension perk."
 tech_lfg_progenitor_forge:0 "Progenitor Forge"
 tech_lfg_progenitor_forge_desc:0 "Only the fury of an O-class star can feed swarms large enough to build a mothership."
 tech_lfg_mothership:0 "Motherships"
 tech_lfg_mothership_desc:0 "A swarm the size of a star system, carrying worlds and birthing endless nanite fighters."
 lfg_progenitor_forge_0:0 "Progenitor Forge Site"
 lfg_progenitor_forge_0_DESC:0 "Collectors are being set around the blue giant, ready to drink its light."
 lfg_progenitor_forge_0_MEGASTRUCTURE_DETAILS:0 "A forge that turns an O-class star's output into nanite swarms vast enough to assemble §YMotherships§!. Built in three stages for £nanites£ §Y50,000,000§! in all. Can only be built around an §YO-class star§!."
 lfg_progenitor_forge_1:0 "Progenitor Forge Frame"
 lfg_progenitor_forge_1_DESC:0 "The first swarms circle the star, building the forge that will build the forge."
 lfg_progenitor_forge_2:0 "Progenitor Forge"
 lfg_progenitor_forge_2_DESC:0 "Fed by an O-class star, its swarms assemble Motherships: ships the size of star systems. The only shipyard that can build them."
 lfg_requires_o_star:0 "Must be built around an §YO-class star§!."
 lfg_requires_progenitor_forge:0 "Can only be built at a §YProgenitor Forge§!."
 lfg_mothership:0 "Mothership"
 lfg_mothership_plural:0 "Motherships"
 lfg_mothership_cap:0 "Mothership"
 LFG_NANITE_SWARM_HANGAR:0 "Nanite Swarm Hangar"
 LFG_NANITE_SWARM_HANGAR_DESC:0 "Launches swarms of self-repairing nanite fighters that tear through shields and armour alike. Motherships only."
 lfg_mothership_escort_fleet:0 "Mothership Escort"
 lfg_requires_nanotech_adopted:0 "Requires the §YNanotech§! traditions to be adopted."
 lfg_requires_nanotech_finished:0 "Requires the §YNanotech§! traditions to be finished."
