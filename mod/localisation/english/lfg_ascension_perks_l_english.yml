l_english:
 ap_lfg_curated_progress:0 "Curated Progress"
 ap_lfg_curated_progress_desc:0 "Not every breakthrough is worth chasing. Our research councils may strike whole lines of incremental study from the agenda, so our scientists spend their time on the work that matters.\n\nUnlocks §YShelve§! edicts: each one stops a specific repeatable technology from being offered as a research option."
 ap_lfg_curated_progress_tt:0 "Unlocks §YShelve§! edicts for every repeatable technology (one per technology; Gigastructural's megastructure capacity repeatables are grouped by research area).\nEach costs §Y1,000§! £unity£ Unity and §Y100§! £influence£ Influence to enact and §Y150§! monthly research of the shelved technology's type, scaled by empire size."
