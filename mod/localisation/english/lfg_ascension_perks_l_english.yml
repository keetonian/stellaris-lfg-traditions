l_english:
 ap_lfg_curated_progress:0 "Curated Progress"
 ap_lfg_curated_progress_desc:0 "Not every breakthrough is worth chasing. Our research councils may strike whole lines of incremental study from the agenda, so our scientists spend their time on the work that matters.\n\nUnlocks §YShelve§! edicts: each one stops a specific repeatable technology from being offered as a research option."
 ap_lfg_curated_progress_tt:0 "Unlocks §YShelve§! edicts for every repeatable technology (one per technology; Gigastructural's megastructure capacity repeatables are grouped by research area).\nEach costs §Y2,000§! £unity£ Unity and §Y200§! £influence£ Influence to enact and §Y300§! monthly research of the shelved technology's type, scaled by empire size."
 ap_lfg_massed_assault:0 "Massed Assault"
 ap_lfg_massed_assault_desc:0 "A planet is not taken one regiment at a time. Our doctrine commits every army at once, on every front, until the defenders are simply overwhelmed.\n\nMore of our armies fight at the same time in ground combat, and every general is trained in the doctrine."
 ap_lfg_massed_assault_tt:0 "All our generals gain the §YMassed Assault Doctrine§! trait: armies they lead get damage §G+25%§!, health §G+25%§! and morale §G+50%§!."
 lfg_requires_ascension_perks_4:0 "$TRIGGER_FAIL$Requires four other Ascension Perks to be selected first."
 ap_lfg_nanite_armada:0 "Nanite Armada"
 ap_lfg_nanite_armada_desc:0 "Why carve warships from dead moons when nanites can grow them from nothing? Given enough nanites, a forge around a great star can assemble moons and planets that fight."
 ap_lfg_nanite_armada_tt:0 "Adds three £engineering£ §YEngineering§! research options:\n- §YSwarmforge§!: a megastructure built around a §Yclass A§! or §Yclass B§! star or a §Yred giant§!.\n- §YNanite Attack Moon§! (£nanites£ §Y500,000§!) and §YNanite Planetcraft§! (£nanites£ §Y1,000,000§!): only built at a Swarmforge, and can be designed in the ship designer."
 tech_lfg_swarmforge:0 "Swarmforge"
 tech_lfg_swarmforge_desc:0 "Nanite swarms fed by the full output of a great star can assemble anything - even warships the size of worlds."
 tech_lfg_nanite_war_moon:0 "Nanite Attack Moons"
 tech_lfg_nanite_war_moon_desc:0 "A moon's worth of nanites, held together by will alone, with a moon's worth of guns."
 tech_lfg_nanite_planetcraft:0 "Nanite Planetcraft"
 tech_lfg_nanite_planetcraft_desc:0 "A planet-sized swarm that thinks, moves and fights as one."
 lfg_swarmforge_0:0 "Swarmforge Site"
 lfg_swarmforge_0_DESC:0 "Collector arrays are being set up around the star, ready to feed the first nanite swarms."
 lfg_swarmforge_0_MEGASTRUCTURE_DETAILS:0 "A shipyard the size of a solar system, where nanite swarms fed by a great star assemble §YNanite Attack Moons§! and §YNanite Planetcraft§!. Can only be built around a §Yclass A§! or §Yclass B§! star or a §Yred giant§!."
 lfg_swarmforge_ready:0 "Swarmforge"
 lfg_swarmforge_ready_DESC:0 "Clouds of nanites, fed by the star, weave hulls the size of moons and planets. The only shipyard that can build our nanite celestial warships."
 lfg_requires_swarmforge:0 "Can only be built at a §YSwarmforge§! or §YProgenitor Forge§!."
 lfg_requires_swarmforge_star:0 "Requires a §Yclass A§! or §Yclass B§! star or a §Yred giant§!."
 lfg_nanite_war_moon:0 "Nanite Attack Moon"
 lfg_nanite_war_moon_plural:0 "Nanite Attack Moons"
 lfg_nanite_war_moon_cap:0 "Nanite Attack Moon"
 lfg_nanite_planetcraft:0 "Nanite Planetcraft"
 lfg_nanite_planetcraft_plural:0 "Nanite Planetcraft"
 lfg_nanite_planetcraft_cap:0 "Nanite Planetcraft"
 ap_lfg_mothership:0 "Mothership"
 ap_lfg_mothership_desc:0 "Moons and planets were only the beginning. Around the hottest stars, our swarms can build a ship the size of a star system that births swarms of its own."
 ap_lfg_mothership_tt:0 "Adds two £engineering£ §YEngineering§! research options: the §YProgenitor Forge§!, a megastructure built around an §YO-class star§!, and the §YMothership§!, which only it can build."
 lfg_requires_ap_nanite_armada:0 "Requires the §YNanite Armada§! ascension perk."
 lfg_requires_ap_celestial_armada:0 "Requires the §YA Celestial Armada§! ascension perk."
 tech_lfg_progenitor_forge:0 "Progenitor Forge"
 tech_lfg_progenitor_forge_desc:0 "Only the fury of an O-class star can feed swarms large enough to build a mothership."
 tech_lfg_mothership:0 "Motherships"
 tech_lfg_mothership_desc:0 "A swarm the size of a star system, carrying worlds and birthing endless nanite fighters."
 lfg_progenitor_forge_0:0 "Progenitor Forge Site"
 lfg_progenitor_forge_0_DESC:0 "Collectors are being set around the blue giant, ready to drink its light."
 lfg_mothership.10.name:0 "The Forge Feeds"
 lfg_mothership.10.desc:0 "The Progenitor Forge's site is complete, and its first swarms are hungry. Every world, moon and rock around the star has been taken apart, leaving the system bare but for the star and what we have built.\n\nWe have gained §Y[Root.lfg_forge_bulk_matter]§! bulk matter."
 lfg_mothership.10.a:0 "Nothing will be wasted."
 lfg_mothership.11.name:0 "The Forge Rises"
 lfg_mothership.11.desc:0 "The second stage of the Progenitor Forge is complete. Rings of nanite stations now circle the blue giant, drinking its light, and clouds of swarms drift between them, waiting for work worthy of them."
 lfg_mothership.11.a:0 "Only one stage remains."
 lfg_mothership.12.name:0 "The Progenitor Forge"
 lfg_mothership.12.desc:0 "The Progenitor Forge is complete. Fed by an O-class star, its yards and swarms can now assemble the greatest thing our nanites have ever built: a §YMothership§!."
 lfg_mothership.12.a:0 "Begin."
 lfg_mothership.14.name:0 "The Mothership Awakens"
 lfg_mothership.14.desc:0 "Our Mothership has left the Progenitor Forge: a ship the size of a star system, wrapped in its own swarm. Wherever it goes, our fleets move faster and strike harder, and its brood follows it into every battle."
 lfg_mothership.14.a:0 "Let the galaxy see it."
 lfg_progenitor_forge_0_MEGASTRUCTURE_DETAILS:0 "Turns an §YO-class star's§! output into nanite swarms vast enough to assemble §YMotherships§!. Built in three stages, £nanites£ §Y50,000,000§! in all."
 lfg_progenitor_forge_1:0 "Progenitor Forge Frame"
 lfg_progenitor_forge_1_DESC:0 "The first swarms circle the star, building the forge that will build the forge."
 lfg_progenitor_forge_2:0 "Progenitor Forge"
 lfg_progenitor_forge_2_DESC:0 "Fed by an O-class star, its swarms assemble Motherships: ships the size of star systems. The only shipyard that can build them; it also builds Nanite Attack Moons and Planetcraft, up to §Y300§! ships at once."
 lfg_requires_o_star:0 "Must be built around an §YO-class star§!."
 lfg_requires_progenitor_forge:0 "Can only be built at a §YProgenitor Forge§!."
 lfg_mothership:0 "Mothership"
 lfg_mothership_plural:0 "Motherships"
 lfg_mothership_cap:0 "Mothership"
 LFG_NANITE_SWARM_HANGAR:0 "Nanite Swarm Hangar"
 LFG_NANITE_SWARM_HANGAR_DESC:0 "Launches swarms of self-repairing nanite fighters that tear through shields and armour alike. Motherships only."
 LFG_MOTHERSHIP_REACTOR:0 "Mothership Swarm Core"
 LFG_MOTHERSHIP_REACTOR_DESC:0 "Powers the Mothership and links every friendly ship in its system to its swarm."
 lfg_mothership_swarm_link:0 "Swarm Link"
 lfg_mothership_swarm_link_desc:0 "Linked to a Mothership's swarm: faster ships and faster-firing kinetic weapons."
 LFG_NANITE_RESHAPER:0 "Nanite Reshaper"
 LFG_NANITE_RESHAPER_DESC:0 "A Reshaping Projectile Accelerator rebuilt at titanic scale from nanites. Each slug reforms mid-flight to punch through shields and armour. Motherships only."
 LFG_NANITE_SIEGE_DRIVER:0 "Nanite Siege Driver"
 LFG_NANITE_SIEGE_DRIVER_DESC:0 "A spinal mass driver grown from the Mothership's own swarm. Its planet-cracking slugs are nanite colonies that keep eating through whatever they hit. Motherships, and up to three on a Maginot World."
 LFG_NANITE_SIEGE_DRIVER_MAGINOT:0 "$LFG_NANITE_SIEGE_DRIVER$"
 LFG_NANITE_SIEGE_DRIVER_MAGINOT_DESC:0 "$LFG_NANITE_SIEGE_DRIVER_DESC$"
 lfg_nanite_siege_driver_on_hit_tt:0 "Deals §Y7,500 - 15,000§! damage to all hostile ships within §E45§! range of the target."
 lfg_nanite_siege_driver_debuff:0 "Nanite Infestation"
 lfg_nanite_siege_driver_debuff_desc:0 "Nanites from a Siege Driver slug are eating through this ship's armour and shield emitters."
 LFG_NANITE_FLAK_SWARM:0 "Nanite Flak Swarm"
 LFG_NANITE_FLAK_SWARM_DESC:0 "Fills the space around the hull with a cloud of nanites that strips incoming missiles and strike craft apart before they come close. Motherships and Maginot Worlds only."
 LFG_NANITE_DISASSEMBLER:0 "Nanite Disassembler"
 LFG_NANITE_DISASSEMBLER_DESC:0 "Unleashes the Mothership's swarm on a world, cracking it apart and taking it in: §Y+5,000§! £nanites£ Nanites per size of the world and §Y+5§! per pop on it. Motherships only."
 LFG_NANITE_STORM_AUTOCANNON:0 "Nanite Storm Autocannon"
 LFG_NANITE_STORM_AUTOCANNON_DESC:0 "The Nanite Autocannon, rebuilt by the Mothership's swarm: its self-guiding nanite rounds hold together four times as far and hit harder. Nanite ships only."
 mod_lfg_mothership_swarmer_storage_add:0 "Nanite Swarmer Storage"
 mod_lfg_mothership_swarmers_per_month_add:0 "Nanite Swarmers Assembled per Month"
 mod_lfg_mothership_interdictor_storage_add:0 "Nanite Interdictor Storage"
 mod_lfg_mothership_interdictors_per_month_add:0 "Nanite Interdictors Assembled per Month"
 LFG_SWARMER_VAULT:0 "Swarmer Hive Vault"
 LFG_SWARMER_VAULT_DESC:0 "Stores §Y+100§! more Nanite Swarmers in the Mothership's reserve. Stacks with every module fitted. Motherships only."
 LFG_SWARMER_FOUNDRY:0 "Swarmer Foundry"
 LFG_SWARMER_FOUNDRY_DESC:0 "Assembles §Y+20§! more Nanite Swarmers a month for the Mothership's reserve. Stacks with every module fitted. Motherships only."
 LFG_INTERDICTOR_VAULT:0 "Interdictor Hive Vault"
 LFG_INTERDICTOR_VAULT_DESC:0 "Stores §Y+40§! more Nanite Interdictors in the Mothership's reserve. Stacks with every module fitted. Motherships only."
 LFG_INTERDICTOR_FOUNDRY:0 "Interdictor Foundry"
 LFG_INTERDICTOR_FOUNDRY_DESC:0 "Assembles §Y+6§! more Nanite Interdictors a month for the Mothership's reserve. Stacks with every module fitted. Motherships only."
 LFG_NANITE_ARMOR:0 "Nanite Armour"
 LFG_NANITE_ARMOR_DESC:0 "Self-repairing nanite plating. The swarm in each plate also feeds and cools the kinetic batteries, raising their fire rate."
 LFG_LM_ACCELERATOR_2:0 "Symbiotic $LM_ACCELERATOR$"
 LFG_LM_ACCELERATOR_2_DESC:0 "Living metal in closer symbiosis reshapes each slug faster and harder than ever, tearing deep into armour."
 LFG_LM_ARMOR_6:0 "Symbiotic Galvanic Armour"
 LFG_SMALL_LM_ARMOR_6:0 "Small $LFG_LM_ARMOR_6$"
 LFG_SMALL_LM_ARMOR_6_DESC:0 "$LFG_LM_ARMOR_6_DESC$"
 LFG_MEDIUM_LM_ARMOR_6:0 "Medium $LFG_LM_ARMOR_6$"
 LFG_MEDIUM_LM_ARMOR_6_DESC:0 "$LFG_LM_ARMOR_6_DESC$"
 LFG_LARGE_LM_ARMOR_6:0 "Large $LFG_LM_ARMOR_6$"
 LFG_LARGE_LM_ARMOR_6_DESC:0 "$LFG_LM_ARMOR_6_DESC$"
 LFG_LM_ARMOR_6_DESC:0 "Living metal grown into a denser lattice: thicker, harder and quicker to heal."
 tech_lfg_lm_accelerator_2:0 "Symbiotic Accelerators"
 tech_lfg_lm_accelerator_2_desc:0 "Deeper symbiosis with the living metal lets the Reshaping Projectile Accelerator reform each slug faster and harder."
 tech_lfg_lm_armor_6:0 "Symbiotic Galvanic Armour"
 tech_lfg_lm_armor_6_desc:0 "Coaxing living metal into denser lattices makes it thicker, harder and faster to regrow."
 lfg_mothership_limit:0 "Only §Yone Mothership§! per empire."
 lfg_requires_mothership_crew:0 "Needs a crew of §Y2,000§! pops: take the §YCrew the Mothership§! decision on a world."
 decision_lfg_mothership_crew:0 "Crew the Mothership"
 decision_lfg_mothership_crew_desc:0 "Send 2,000 of this world's people to live aboard the Mothership and guide its swarms."
 lfg_mothership_crew_effect_tt:0 "§R2,000§! pops leave this world to crew our next §YMothership§!."
 lfg_mothership_crew_needs_pops:0 "Needs more than §Y2,000§! pops on this world."
 lfg_mothership_escort_fleet:0 "Mothership Escort"
 lfg_requires_nanotech_adopted:0 "Requires the §YNanotech§! traditions to be adopted."
 lfg_requires_nanotech_finished:0 "Requires the §YNanotech§! traditions to be finished."
 lfg_allow_swarmforge:0 "§HUnlocks Megastructure:§! Swarmforge"
 lfg_allow_swarmforge_desc:0 "A giant nanite shipyard built around a §Yclass A§! or §Yclass B§! star or a §Yred giant§!: the only place §YNanite Attack Moons§! and §YNanite Planetcraft§! can be built."
 lfg_allow_swarmforge_ships:0 "§HBuilt at:§! Swarmforge, Progenitor Forge"
 lfg_allow_swarmforge_ships_desc:0 "Paid in £nanites£ Nanites, built only at a §YSwarmforge§! or §YProgenitor Forge§!, and designable in the ship designer."
 lfg_allow_progenitor_forge:0 "§HUnlocks Megastructure:§! Progenitor Forge"
 lfg_allow_progenitor_forge_desc:0 "Built around an §YO-class star§! in three stages: the only place §YMotherships§! can be built."
 lfg_allow_mothership_forge:0 "§HBuilt at:§! Progenitor Forge"
 lfg_allow_mothership_forge_desc:0 "Paid in £nanites£ Nanites, built only at a §YProgenitor Forge§!, and designable in the ship designer."
 lfg_allow_mothership_escort:0 "§HEscort:§! Nanite Swarmers and Interdictors"
 lfg_allow_mothership_escort_desc:0 "A Mothership builds up a reserve of §Y80§! Nanite Swarmers and §Y20§! Nanite Interdictors a month (up to §Y600§! / §Y200§!). In battle it deploys them as an escort that follows it and takes no naval capacity; once no enemy is left in the system, the survivors return."
 lfg_allow_mothership_components:0 "§HUnlocks Components:§! Nanite weapons, armour, hangars and swarm modules"
 lfg_allow_mothership_components_desc:0 "Nanite weapons, armour, hangars and swarm modules for the Mothership and other nanite ships."

 ap_lfg_storm_sovereignty:0 "Storm Sovereignty"
 ap_lfg_storm_sovereignty_desc:0 "We no longer weather the storms. We call them."
 ap_lfg_storm_sovereignty_tt:0 "Adds a £physics£ §YPhysics§! research option: the §YTempest Lodestar§!, a megastructure that can §Ysummon Nexus Storms§! and empowers our planets and fleets inside them.\n§YStorm Chasers§! also become §Gimmune§! to the harmful effects of cosmic storms, get these bonuses without a Lodestar, pay §G25%§! less job upkeep inside Nexus Storms, their ships repair §G3%§! a month inside storms, and Nexus Storms leave their colonies only the §Gbenefits§! of every storm's aftermath.\nEvery colony gains §G+5%§! job efficiency for each Nexus Storm it survives. Their summoned storms §Rbatter§! (but never destroy) other empires' ships and stations, hardest our enemies', and speed our allies."
 lfg_requires_ap_galactic_wonders:0 "Requires the §YGalactic Wonders§! Ascension Perk."
 lfg_requires_ap_weather_control:0 "Requires the §YGalactic Weather Control§! Ascension Perk."
 tech_lfg_tempest_lodestar:0 "Tempest Lodestar"
 tech_lfg_tempest_lodestar_desc:0 "A star wrapped in a captive storm, its pylons ready to hurl the tempest across the stars."
 lfg_allow_tempest_lodestar:0 "§HUnlocks Megastructure:§! Tempest Lodestar"
 lfg_allow_tempest_lodestar_desc:0 "Built around any star in our borders, one per empire. It can summon §YNexus Storms§!."
 lfg_tempest_lodestar_0:0 "Tempest Lodestar Site"
 lfg_tempest_lodestar_0_DESC:0 "Pylons are being anchored around the star to cage a storm."
 lfg_tempest_lodestar_0_MEGASTRUCTURE_DETAILS:0 "A captive storm around a star. Finished, it can §Ysummon Nexus Storms§!, and our planets and fleets grow stronger inside them. One per empire."
 lfg_tempest_lodestar_1:0 "Tempest Lodestar"
 lfg_requires_storm_sovereignty:0 "Requires the §YStorm Sovereignty§! ascension perk."
 lfg_storm_enthusiasts:0 "Storm Enthusiasts"
 lfg_storm_enthusiasts_desc:0 "This colony grows bolder with every Nexus Storm it weathers: §G+5%§! job efficiency per storm survived."
 lfg_nexus_storm_boon:0 "Nexus Afterglow"
 lfg_nexus_storm_boon_desc:0 "The Nexus Storm passed, leaving only the gifts of every storm in its wake."
 lfg_nexus_storm_boon_tt:0 "£volatile_motes£ §YVolatile Motes§! from Pops: §G+0.06§!\n£rare_crystals£ §YRare Crystals§! from Pops: §G+0.06§!"
 lfg_lodestar_eye:0 "Eye of the Storm"
 lfg_lodestar_eye_desc:0 "The Tempest Lodestar holds a storm around this system: it is always inside a Nexus Storm for us."
 lfg_lodestar_eye_chaser:0 "Eye of the Storm: Storm Chasers"
 lfg_lodestar_eye_chaser_desc:0 "Born to the storm, our people thrive at the Lodestar."
 lfg_lodestar_eye_fleet:0 "Eye of the Storm"
 lfg_lodestar_eye_fleet_desc:0 "Our ships ride the Lodestar's captive storm."
 lfg_tempest_lodestar_1_DESC:0 "A storm held around a star by a ring of lightning.\n- Draws cosmic storms toward this system\n- §YSummon Nexus Storm§! every §Y10§! years\n- This system always counts as inside a §YNexus Storm§! for us\n- Inside Nexus Storms, our colonies: §G+50%§! resources from jobs, §G+5§! stability\n- Inside Nexus Storms, our fleets: §G+25%§! fire rate, §G+50%§! speed, §G+20%§! evasion"
 lfg_requires_one_tempest_lodestar:0 "We can only have one §YTempest Lodestar§!."
 lfg_requires_star:0 "Must be built around a star."
 lfg_summon_nexus_storm_button:0 "§HSummon Nexus Storm§!\nTarget a system with one of our §Yscience ships§! (with its scientist) in it: a Nexus Storm forms there. In our own systems we can hold it in place; elsewhere it rages on. If another empire owns the system, every empire we know will think less of us; that empire far less.\nCosts §Y30,000§! £energy£, §Y3,000§! each of £volatile_motes£ £exotic_gases£ £rare_crystals£, §Y100§! £sr_dark_matter£ and §Y100§! £influence£. The Lodestar can summon again after §Y10§! years."
 lfg_summon_nexus_storm_needs_scientist:0 "One of our §Yscience ships§!, with its scientist, must be in this system to call the storm down."
 lfg_summon_nexus_storm_cant_afford:0 "Summoning costs §Y30,000§! £energy£, §Y3,000§! each of £volatile_motes£ £exotic_gases£ £rare_crystals£, §Y100§! £sr_dark_matter£ and §Y100§! £influence£."
 lfg_summon_nexus_storm_menu:0 "Summon Nexus Storm"
 lfg_summon_nexus_storm_activity:0 "Summoning a Nexus Storm"
 lfg_nexus_storm_summoned:0 "Summoned a Nexus Storm"
 lfg_storm_immunity:0 "Storm Sovereigns"
 lfg_storm_immunity_desc:0 "Our people were born to the storm: cosmic storms no longer harm our worlds or fleets."

 lfg_storms.2.name:0 "The Tempest Lodestar"
 lfg_storms.2.desc:0 "The Lodestar's pylons are charged and the captive storm strains against its cage. A Nexus Storm is ready to break over [lfg_storm_system.GetName]."
 lfg_storms.2.a:0 "Hold it there."
 lfg_storms.2.a.tt:0 "A §YNexus Storm§! forms over §Y[lfg_storm_system.GetName]§! and §Ystays there§! until the Lodestar can summon again (§Y10§! years), then moves on."
 lfg_storms.2.b:0 "Let it rage."
 lfg_storms.2.b.tt:0 "A §YNexus Storm§! forms over §Y[lfg_storm_system.GetName]§! and moves on like any storm."
 lfg_nexus_storm_targeted:0 "Unleashed a Nexus Storm on us"
 lfg_lodestar_storm_pull:0 "Tempest Lodestar"
 lfg_lodestar_storm_pull_desc:0 "The Lodestar draws cosmic storms toward this system."
 lfg_storm_lashed_tt:0 "§HStorm-Lashed:§! This storm was turned against us: §R4%§! of max hull lost each month, down to §Y20%§!; no armour regeneration."
 lfg_storm_buffeted_tt:0 "§HStorm-Buffeted:§! This storm was summoned by others: §R2%§! of max hull lost each month, down to §Y20%§!; no armour regeneration."
 lfg_harnessed_storms_tt:0 "§HHarnessed Storms:§! We have learned to harness the energy of the storms. Job upkeep §G-25%§!."
 ap_lfg_legendary_dragons:0 "Legendary Dragons"
 ap_lfg_legendary_dragons_desc:0 "Our drakes have grown old and vast under our care. One of them, chosen and honoured above all, need never stop growing."
 ap_lfg_legendary_dragons_tt:0 "Unlocks the §YAnoint a Legendary Dragon§! decision: one of our §YElder Dragons§! becomes our §YLegendary Dragon§! and keeps growing every 4 years, far beyond any other. Only one may live at a time.\n\n§HHunting:§! when a fleet with our drakes slays a living leviathan - a Dimensional Horror, Stellar Devourer, Corrupted Avatar, Tiyanki Matriarch, Voidspawn, Toxic God, Ether Drake, Shard or Sky Dragon - each of those drakes that can still grow §Ggrows a stage§!.\n\nAdds a £society£ §YSociety§! research option: §YDraconic Feasts§!, to speed their growth further."
 lfg_requires_dragon_breeders:0 "Requires that the §YSky Dragon§! has entrusted its young to us."
 decision_lfg_legendary_dragon:0 "Anoint a Legendary Dragon"
 decision_lfg_legendary_dragon_desc:0 "Choose one of our Elder Dragons to become the Legendary Dragon of our people."
 decision_lfg_legendary_dragon_effect_tt:0 "Choose one of our §YElder Dragons§!: it becomes our §YLegendary Dragon§! and grows again every 4 years, up to §Y24§! growth stages. A starving Legendary Dragon eats twice as much."
 lfg_legendary_dragon_exists:0 "We already have a §YLegendary Dragon§!."
 lfg_needs_elder_dragon:0 "We have no §YElder Dragon§!: drakes become Elders §Y44§! years after hatching."
 lfg_dragons.2.name:0 "A Hungry Dragon"
 lfg_dragons.2.desc:0 "Our granaries are empty, and §Y[lfg_hungry_drake.GetName]§! went unfed. Displeased, it descended on §Y[lfg_drake_meal_planet.GetName]§! and took its meal there: §R[lfg_hungry_drake.lfg_drake_pops_eaten]§! of our people were devoured.\n\nIt will be hungry again within the year."
 lfg_dragons.2.a:0 "Feed the dragons!"
 lfg_dragons.3.name:0 "The Legendary Dragon"
 lfg_dragons.3.desc:0 "Which of our Elder Dragons shall we raise above all others?"
 lfg_dragons.3.elder_1:0 "[lfg_elder_1.GetName]"
 lfg_dragons.3.elder_2:0 "[lfg_elder_2.GetName]"
 lfg_dragons.3.elder_3:0 "[lfg_elder_3.GetName]"
 lfg_dragons.3.elder_4:0 "[lfg_elder_4.GetName]"
 lfg_dragons.3.elder_tt:0 "It becomes our §YLegendary Dragon§! and grows again every 4 years."
 lfg_dragons.3.others:0 "Show others"
 lfg_dragons.3.cancel:0 "Not yet."
 lfg_dragons.10.name:0 "Dragon Testing"
 lfg_dragons.10.desc:0 "Testing tools for growing drakes (console: event lfg_dragons.10). Growth stops at the Elder (step 11), or step 24 for the Legendary Dragon."
 lfg_dragons.10.spawn:0 "Spawn a Baby Drake at our capital"
 lfg_dragons.10.grow_1:0 "Grow every drake 1 step (4 years)"
 lfg_dragons.10.grow_5:0 "Grow every drake 5 steps (20 years)"
 lfg_dragons.10.grow_max:0 "Grow every drake to its cap"
 lfg_dragons.10.legendary:0 "Make an Elder our Legendary Dragon"
 lfg_dragons.10.starve:0 "Every drake eats now (as if starving)"
 lfg_dragons.10.close:0 "Close"
 lfg_dragons.4.name:0 "An Elder Dragon"
 lfg_dragons.4.desc:0 "§Y[lfg_new_elder.GetName]§! has come of age: it is now an §YElder Dragon§!, and has grown as large as it ever will.\n\nUnless we raise it, or another Elder, above all others. We have no §YLegendary Dragon§! yet."
 lfg_dragons.4.a:0 "We will consider it."
 lfg_dragons.4.a.tt:0 "Use the §YAnoint a Legendary Dragon§! decision on our capital, §Y[Root.Capital.GetName]§!, to make one of our Elder Dragons our §YLegendary Dragon§!: it will grow again every 4 years."
 tech_lfg_draconic_feast:0 "Draconic Feasts"
 tech_lfg_draconic_feast_desc:0 "A dragon grows as fast as it is fed. Our keepers have learned what - and whom - a drake needs to grow in months what would otherwise take years."
 lfg_allow_draconic_feast:0 "§HUnlocks Decisions:§! Feast for a Dragon, Tribute of Flesh"
 lfg_allow_draconic_feast_desc:0 "§YFeast for a Dragon§!: pay §Y5 years§! of a drake's food upkeep for §Y4 years§! of growth.\n§YTribute of Flesh§!: feed a drake §R100§! of our pops per growth stage (§R300§! for the Legendary Dragon) for §Y4 years§! of growth, once every 6 months. Not for xenophiles, hive minds or virtual machines."
 decision_lfg_dragon_feast:0 "Feast for a Dragon"
 decision_lfg_dragon_feast_desc:0 "Empty the granaries for one of our drakes. Five years of food for four years of growth: wasteful, ruinous, and very fast."
 decision_lfg_dragon_feast_effect_tt:0 "Choose one of our drakes: pay §Y5 years§! of its current food upkeep, and it grows a stage at once (§Y4 years§! of growth)."
 decision_lfg_dragon_tribute:0 "Tribute of Flesh"
 decision_lfg_dragon_tribute_desc:0 "Some of our people will be given to a dragon. It will grow strong on them."
 decision_lfg_dragon_tribute_effect_tt:0 "Choose one of our drakes: it devours §R100§! pops per growth stage (§R300§! per stage for the Legendary Dragon) from our most populous colony, and grows a stage at once. Usable once every §Y6§! months."
 lfg_dragon_tribute_cooling_down:0 "Our dragons were fed less than §Y6§! months ago."
 lfg_needs_growing_drake:0 "We have no drake that can still grow."
 lfg_dragons.5.name:0 "Feast for a Dragon"
 lfg_dragons.5.desc:0 "Which of our drakes shall feast? A feast costs §Y5 years§! of its food upkeep, and the bigger the dragon, the bigger the feast."
 lfg_dragons.5.drake_1:0 "[lfg_feast_1.GetName]"
 lfg_dragons.5.drake_2:0 "[lfg_feast_2.GetName]"
 lfg_dragons.5.drake_3:0 "[lfg_feast_3.GetName]"
 lfg_dragons.5.drake_4:0 "[lfg_feast_4.GetName]"
 lfg_dragons.5.drake_1.tt:0 "Costs £food£ §Y[lfg_feast_1.lfg_drake_feast_cost]§! food. It grows a stage at once."
 lfg_dragons.5.drake_2.tt:0 "Costs £food£ §Y[lfg_feast_2.lfg_drake_feast_cost]§! food. It grows a stage at once."
 lfg_dragons.5.drake_3.tt:0 "Costs £food£ §Y[lfg_feast_3.lfg_drake_feast_cost]§! food. It grows a stage at once."
 lfg_dragons.5.drake_4.tt:0 "Costs £food£ §Y[lfg_feast_4.lfg_drake_feast_cost]§! food. It grows a stage at once."
 lfg_dragons.5.others:0 "Show others"
 lfg_dragons.5.cancel:0 "Not today."
 lfg_dragons.6.name:0 "Tribute of Flesh"
 lfg_dragons.6.desc:0 "Which of our drakes shall receive the tribute? It will be taken from our most populous world."
 lfg_dragons.6.drake_1:0 "[lfg_tribute_1.GetName]"
 lfg_dragons.6.drake_2:0 "[lfg_tribute_2.GetName]"
 lfg_dragons.6.drake_3:0 "[lfg_tribute_3.GetName]"
 lfg_dragons.6.drake_4:0 "[lfg_tribute_4.GetName]"
 lfg_dragons.6.drake_1.tt:0 "It devours §R[lfg_tribute_1.lfg_drake_tribute]§! of our pops, and grows a stage at once."
 lfg_dragons.6.drake_2.tt:0 "It devours §R[lfg_tribute_2.lfg_drake_tribute]§! of our pops, and grows a stage at once."
 lfg_dragons.6.drake_3.tt:0 "It devours §R[lfg_tribute_3.lfg_drake_tribute]§! of our pops, and grows a stage at once."
 lfg_dragons.6.drake_4.tt:0 "It devours §R[lfg_tribute_4.lfg_drake_tribute]§! of our pops, and grows a stage at once."
 lfg_dragons.6.others:0 "Show others"
 lfg_dragons.6.cancel:0 "Not today."
 lfg_dragons.8.name:0 "The Hunt"
 lfg_dragons.8.desc:0 "§Y[lfg_hunter.GetName]§! has brought down a leviathan and gorged itself on the remains.\n\nOur drakes in that fleet have grown a stage."
 lfg_dragons.8.a:0 "A worthy kill."
 ap_lfg_shadow_transactions:0 "Shadow Transactions"
 ap_lfg_shadow_transactions_desc:0 "Out beyond the rim, every deal is off the books. Our syndicate's ledgers run through shell companies, smugglers and alien middlemen, and somewhere in all that paper are the secrets of everyone we do business with."
 lfg_operation_shadow_branch:0 "Shadow Branch Office"
 lfg_operation_shadow_branch_desc:0 "Our operatives quietly buy, bribe and blackmail their way into a local business on one of [target.GetName]'s worlds. When the paperwork clears, it belongs to us - a branch office no hyperlane ever needed to reach."
 lfg_operation_shadow_branch_no_planet:0 "The target can't host a branch office, or has no planet we know (surveyed, or revealed by intel) without one."
 lfg_sealed_ring.20.name:0 "Shadow Branch Office: Contacts"
 lfg_sealed_ring.20.desc:0 "Our operatives have found a struggling local business in [target.GetName]'s space whose owners are drowning in debt. They are happy to sell - quietly - to anyone who asks no questions."
 lfg_sealed_ring.21.name:0 "Shadow Branch Office: Open for Business"
 lfg_sealed_ring.21.desc:0 "The deal is done. On paper, nothing has changed; in practice, every credit that passes through the business now finds its way to us."
 lfg_sealed_ring.21.a:0 "Business as usual."
 lfg_sealed_ring.21.a.tt:0 "We establish a §YBranch Office§! on a random world of theirs that we know (surveyed, or revealed by intel)."
 lfg_sealed_ring.20.a:0 "Make them an offer."
 ap_lfg_shadow_transactions_tt:0 "Unlocks two espionage operations: §YShadow Branch Office§! opens a §YBranch Office§! on a random world of the target that we know, and §YRemove Branch Office§! closes a random branch office - anyone's but ours - on one of the target's worlds."
 lfg_operation_remove_branch:0 "Remove Branch Office"
 lfg_operation_remove_branch_desc:0 "A forged audit here, a tipped-off inspector there, and a rival's branch office on one of [target.GetName]'s worlds will find itself out of business."
 lfg_operation_remove_branch_no_office:0 "None of the target's planets has a branch office other than ours."
 lfg_sealed_ring.22.name:0 "Remove Branch Office: Following the Money"
 lfg_sealed_ring.22.desc:0 "Our operatives have traced the accounts of a branch office in [target.GetName]'s space. Its books are clean - suspiciously clean."
 lfg_sealed_ring.22.a:0 "Dig deeper."
 lfg_sealed_ring.23.name:0 "Remove Branch Office: Leverage"
 lfg_sealed_ring.23.desc:0 "We have found what we needed: a regulator with debts, a manager with secrets, and enough forged paperwork to sink a fleet."
 lfg_sealed_ring.23.a:0 "Prepare the audit."
 lfg_sealed_ring.24.name:0 "Remove Branch Office: Closed for Good"
 lfg_sealed_ring.24.desc:0 "The scandal broke overnight. By morning the branch office's doors were sealed, its staff scattered and its owners left wondering who in the galaxy could have wanted them gone."
 lfg_sealed_ring.24.a:0 "Nothing personal."
 lfg_sealed_ring.24.a.tt:0 "A random §YBranch Office§! on one of their worlds - anyone's but ours - is §Rclosed§!."
